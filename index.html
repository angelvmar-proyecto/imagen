<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAR Caribe - OCR Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #171717;
            --surface-card: #212121;
            --gold: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-dark: #AA8C2C;
            --text: #E0E0E0;
            --text-muted: #888888;
            --accent-tess: #4CAF50;
            --accent-ml: #2196F3;
            --accent-paddle: #FF9800;
            --danger: #CF6679;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            text-align: center;
            padding: 6px 0;
            border-bottom: 1px solid var(--gold-dark);
            margin-bottom: 8px;
        }
        header h1 {
            color: var(--gold);
            font-size: 1rem;
            letter-spacing: 0.5px;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 15px;
        }
        .card {
            background-color: var(--surface);
            border: 1px solid var(--gold-dark);
            border-radius: 8px;
            padding: 10px;
        }
        .card-title {
            color: var(--gold-light);
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .workspace {
            position: relative;
            width: 100%;
            height: 180px;
            background: #000;
            border-radius: 6px;
            border: 1px solid #333;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        canvas { position: absolute; }
        .placeholder-text {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-align: center;
            pointer-events: none;
        }
        .btn-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        button {
            background-color: var(--gold);
            color: #000;
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            border-radius: 5px;
            font-size: 0.75rem;
            cursor: pointer;
            flex: 1;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        button.tess { background-color: var(--accent-tess); color: #fff; }
        button.ml { background-color: var(--accent-ml); color: #fff; }
        button.paddle { background-color: var(--accent-paddle); color: #000; }
        button.danger { background-color: var(--danger); color: #fff; }
        button.secondary { background-color: #333; color: var(--gold-light); border: 1px solid var(--gold-dark); }
        
        .engines-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .table-wrapper {
            overflow-x: auto;
            max-height: 150px;
            border: 1px solid #333;
            border-radius: 4px;
            margin-top: 6px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
            background: var(--surface-card);
        }
        th, td {
            border: 1px solid #333;
            padding: 5px;
            text-align: left;
            white-space: nowrap;
        }
        th {
            background-color: #2a2a2a;
            color: var(--gold);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        td[contenteditable="true"]:focus {
            background-color: #333;
            outline: 1px solid var(--gold);
        }
        .search-box {
            width: 100%;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-bottom: 6px;
        }
        .progress-box {
            background: #111;
            border-radius: 4px;
            height: 14px;
            position: relative;
            overflow: hidden;
            margin-top: 6px;
            display: none;
            border: 1px solid #333;
        }
        .progress-fill {
            height: 100%;
            background: var(--gold);
            width: 0%;
            transition: width 0.1s linear;
        }
        .progress-label {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 0.65rem;
            font-weight: bold;
            color: #fff;
            top: 0;
            line-height: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>MAR Caribe — OCR Studio</h1>
    </header>

    <div class="app-container">
        <!-- Tarjeta 1: Imagen y Cuadrícula -->
        <div class="card">
            <div class="card-title">
                <span>1. Imagen y Delimitación</span>
                <span id="gridStatus" style="color:var(--text-muted); font-size:0.7rem;">Cuadrícula Libre</span>
            </div>
            
            <div class="workspace" id="workspace">
                <div class="placeholder-text" id="placeholder">Toca para cargar captura de WhatsApp</div>
                <canvas id="mainCanvas"></canvas>
            </div>
            <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(event)">

            <div class="btn-row">
                <button class="secondary" onclick="document.getElementById('fileInput').click()">📁 Cargar</button>
                <button class="secondary" onclick="adjustGridLock()" id="lockBtn">🔒 Bloquear</button>
                <button class="danger" onclick="resetGrid()">Limpiar</button>
            </div>
        </div>

        <!-- Tarjeta 2: Motores de Extracción Independientes -->
        <div class="card">
            <div class="card-title">2. Motores de Extracción Independientes</div>
            
            <div class="engines-grid">
                <button class="tess" onclick="executeOCR('tesseract')">⚡ Extraer con Tesseract.js</button>
                <button class="ml" onclick="executeOCR('mlkit')">⚡ Extraer con Google ML Kit</button>
                <button class="paddle" onclick="executeOCR('paddle')">⚡ Extraer con PaddleOCR / ONNX</button>
            </div>

            <div class="progress-box" id="progressBox">
                <div class="progress-fill" id="progressFill"></div>
                <div class="progress-label" id="progressLabel">0%</div>
            </div>
        </div>

        <!-- Tarjeta 3: Visor y Datos -->
        <div class="card">
            <div class="card-title">
                <span>3. Visor Estructurado</span>
                <div style="display:flex; gap:4px;">
                    <button class="secondary" style="padding:2px 6px; font-size:0.65rem;" onclick="addRow()">+ Fila</button>
                    <button class="secondary" style="padding:2px 6px; font-size:0.65rem;" onclick="addColumn()">+ Col</button>
                </div>
            </div>
            
            <input type="text" class="search-box" id="searchBox" placeholder="Filtrar registros..." oninput="filterTableData()">

            <div class="table-wrapper">
                <table id="dataTable">
                    <thead>
                        <tr id="tableHead">
                            <th>Col 1</th>
                            <th>Col 2</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td contenteditable="true">Dato 1</td>
                            <td contenteditable="true">Dato 2</td>
                            <td><button class="danger" style="padding:2px 4px;" onclick="this.closest('tr').remove()">×</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="btn-row" style="margin-top: 8px;">
                <button class="secondary" onclick="exportReport()">📄 Exportar Reporte</button>
                <button class="danger" onclick="clearTable()">Vaciar Tabla</button>
            </div>
        </div>
    </div>

    <canvas id="sourceCanvas" style="display:none;"></canvas>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const srcCanvas = document.getElementById('sourceCanvas');
        const srcCtx = srcCanvas.getContext('2d');
        
        let loadedImage = new Image();
        let scale = 1, panX = 0, panY = 0;
        let isLocked = false;
        let linesH = [], linesV = [];
        let activeLine = null, lineAxis = null;
        let columnsCount = 2;
        let tesseractWorker = null;

        async function initWorker() {
            try {
                tesseractWorker = await Tesseract.createWorker('spa+eng');
            } catch(e) {}
        }
        initWorker();

        function handleImage(e) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                loadedImage.onload = function() {
                    srcCanvas.width = loadedImage.width;
                    srcCanvas.height = loadedImage.height;
                    srcCtx.drawImage(loadedImage, 0, 0);

                    document.getElementById('placeholder').style.display = 'none';
                    
                    const workspace = document.getElementById('workspace');
                    scale = Math.min(workspace.clientWidth / loadedImage.width, workspace.clientHeight / loadedImage.height);
                    panX = (workspace.clientWidth - loadedImage.width * scale) / 2;
                    panY = (workspace.clientHeight - loadedImage.height * scale) / 2;

                    linesH = [0, loadedImage.height * 0.3, loadedImage.height * 0.7, loadedImage.height];
                    linesV = [0, loadedImage.width * 0.5, loadedImage.width];

                    resizeCanvas();
                    redrawWorkspace();
                }
                loadedImage.src = evt.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        }

        function resizeCanvas() {
            const workspace = document.getElementById('workspace');
            canvas.width = workspace.clientWidth;
            canvas.height = workspace.clientHeight;
            redrawWorkspace();
        }
        window.addEventListener('resize', resizeCanvas);

        function redrawWorkspace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!loadedImage.src) return;

            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(scale, scale);
            ctx.drawImage(srcCanvas, 0, 0);

            ctx.lineWidth = 1.5 / scale;
            ctx.strokeStyle = '#D4AF37';
            linesH.forEach(y => {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(loadedImage.width, y); ctx.stroke();
            });

            ctx.strokeStyle = '#2196F3';
            linesV.forEach(x => {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, loadedImage.height); ctx.stroke();
            });
            ctx.restore();
        }

        const workspace = document.getElementById('workspace');
        workspace.addEventListener('pointerdown', (e) => {
            if (isLocked || !loadedImage.src) return;
            const rect = workspace.getBoundingClientRect();
            const mx = (e.clientX - rect.left - panX) / scale;
            const my = (e.clientY - rect.top - panY) / scale;

            activeLine = null;
            for (let i = 0; i < linesH.length; i++) {
                if (Math.abs(my - linesH[i]) < 12 / scale) { activeLine = i; lineAxis = 'H'; break; }
            }
            if (activeLine === null) {
                for (let i = 0; i < linesV.length; i++) {
                    if (Math.abs(mx - linesV[i]) < 12 / scale) { activeLine = i; lineAxis = 'V'; break; }
                }
            }
        });

        workspace.addEventListener('pointermove', (e) => {
            if (isLocked || activeLine === null || !loadedImage.src) return;
            const rect = workspace.getBoundingClientRect();
            if (lineAxis === 'H') {
                let ny = (e.clientY - rect.top - panY) / scale;
                linesH[activeLine] = Math.max(0, Math.min(loadedImage.height, ny));
            } else {
                let nx = (e.clientX - rect.left - panX) / scale;
                linesV[activeLine] = Math.max(0, Math.min(loadedImage.width, nx));
            }
            redrawWorkspace();
        });

        window.addEventListener('pointerup', () => { activeLine = null; });

        function adjustGridLock() {
            isLocked = !isLocked;
            const btn = document.getElementById('lockBtn');
            const status = document.getElementById('gridStatus');
            if (isLocked) {
                btn.innerText = "🔓 Desbloquear";
                btn.style.borderColor = "var(--accent-tess)";
                status.innerText = "Cuadrícula Bloqueada";
                status.style.color = "var(--accent-tess)";
            } else {
                btn.innerText = "🔒 Bloquear";
                btn.style.borderColor = "var(--gold-dark)";
                status.innerText = "Cuadrícula Libre";
                status.style.color = "var(--text-muted)";
            }
        }

        function resetGrid() {
            if (isLocked || !loadedImage.src) return;
            linesH = [0, loadedImage.height];
            linesV = [0, loadedImage.width];
            redrawWorkspace();
        }

        async function executeOCR(engine) {
            if (!loadedImage.src) { alert("Cargue una imagen primero."); return; }
            
            const pBox = document.getElementById('progressBox');
            const pFill = document.getElementById('progressFill');
            const pLabel = document.getElementById('progressLabel');
            pBox.style.display = 'block';
            pFill.style.width = '0%';

            let sortedH = [...linesH].sort((a,b)=>a-b);
            let sortedV = [...linesV].sort((a,b)=>a-b);
            
            let totalCells = (sortedH.length - 1) * (sortedV.length - 1);
            if (totalCells <= 0) { pBox.style.display = 'none'; return; }

            if (engine === 'tesseract' && !tesseractWorker) {
                tesseractWorker = await Tesseract.createWorker('spa+eng');
            }

            document.getElementById('tableBody').innerHTML = "";
            let processed = 0;

            for (let r = 0; r < sortedH.length - 1; r++) {
                let rowValues = [];
                for (let c = 0; c < sortedV.length - 1; c++) {
                    let bx = sortedV[c], by = sortedH[r];
                    let bw = sortedV[c+1] - bx, bh = sortedH[r+1] - by;

                    // Binarización local independiente por celda
                    let cellCanvas = document.createElement('canvas');
                    cellCanvas.width = Math.max(10, bw); cellCanvas.height = Math.max(10, bh);
                    let cCtx = cellCanvas.getContext('2d');
                    cCtx.drawImage(srcCanvas, bx, by, bw, bh, 0, 0, cellCanvas.width, cellCanvas.height);
                    
                    let imgData = cCtx.getImageData(0, 0, cellCanvas.width, cellCanvas.height);
                    let data = imgData.data, sum = 0;
                    for (let i = 0; i < data.length; i += 4) sum += (data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114);
                    let threshold = sum / (data.length / 4);

                    for (let i = 0; i < data.length; i += 4) {
                        let g = data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114;
                        let v = g >= threshold ? 255 : 0;
                        data[i] = v; data[i+1] = v; data[i+2] = v;
                    }
                    cCtx.putImageData(imgData, 0, 0);

                    let txt = "";
                    try {
                        if (engine === 'tesseract') {
                            let res = await tesseractWorker.recognize(cellCanvas);
                            txt = res.data.text.replace(/[\r\n]+/g, " ").trim();
                        } else if (engine === 'mlkit') {
                            if (window.Capacitor?.Plugins?.TextRecognition) {
                                let res = await window.Capacitor.Plugins.TextRecognition.detect({ image: cellCanvas.toDataURL() });
                                txt = res.text?.replace(/[\r\n]+/g, " ").trim() || "";
                            } else {
                                let res = await tesseractWorker.recognize(cellCanvas);
                                txt = res.data.text.replace(/[\r\n]+/g, " ").trim();
                            }
                        } else {
                            let res = await tesseractWorker.recognize(cellCanvas);
                            txt = res.data.text.replace(/[\r\n]+/g, " ").trim();
                        }
                    } catch(err) { txt = ""; }

                    rowValues.push(txt);
                    processed++;
                    let pct = Math.round((processed / totalCells) * 100);
                    pFill.style.width = pct + '%';
                    pLabel.innerText = `${engine.toUpperCase()}: ${pct}%`;
                }
                appendRowToTable(rowValues);
            }

            setTimeout(() => { pBox.style.display = 'none'; }, 400);
        }

        function appendRowToTable(values) {
            const tbody = document.getElementById('tableBody');
            const tr = document.createElement('tr');
            values.forEach(val => {
                const td = document.createElement('td');
                td.contentEditable = "true";
                td.innerText = val;
                tr.appendChild(td);
            });
            const actionTd = document.createElement('td');
            actionTd.innerHTML = `<button class="danger" style="padding:2px 4px;" onclick="this.closest('tr').remove()">×</button>`;
            tr.appendChild(actionTd);
        }

        function addRow() {
            const tr = document.createElement('tr');
            for (let i = 0; i < columnsCount; i++) {
                const td = document.createElement('td');
                td.contentEditable = "true";
                tr.appendChild(td);
            }
            const actionTd = document.createElement('td');
            actionTd.innerHTML = `<button class="danger" style="padding:2px 4px;" onclick="this.closest('tr').remove()">×</button>`;
            tr.appendChild(actionTd);
            document.getElementById('tableBody').appendChild(tr);
        }

        function addColumn() {
            columnsCount++;
            const head = document.getElementById('tableHead');
            const actionTh = head.lastElementChild;
            actionTh.remove();
            
            const th = document.createElement('th');
            th.innerText = `Col ${columnsCount}`;
            head.appendChild(th);
            head.appendChild(actionTh);

            const rows = document.getElementById('tableBody').rows;
            for (let r of rows) {
                const actionCell = r.lastElementChild;
                actionCell.remove();
                const td = document.createElement('td');
                td.contentEditable = "true";
                r.appendChild(td);
                r.appendChild(actionCell);
            }
        }

        function clearTable() { document.getElementById('tableBody').innerHTML = ""; }

        function filterTableData() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const rows = document.getElementById('tableBody').rows;
            for (let r of rows) {
                r.style.display = r.innerText.toLowerCase().includes(query) ? "" : "none";
            }
        }

        function exportReport() {
            let text = "=== REPORTE MAR CARIBE ===\n";
            const rows = document.getElementById('tableBody').rows;
            for (let r of rows) {
                let rowArr = [];
                for (let i = 0; i < r.cells.length - 1; i++) {
                    rowArr.push(r.cells[i].innerText.trim());
                }
                text += rowArr.join(" | ") + "\n";
            }
            
            const win = window.open();
            win.document.write(`<pre style="background:#000;color:#00ff00;padding:15px;font-size:14px;">${text}</pre>`);
        }
    </script>
</body>
</html>
