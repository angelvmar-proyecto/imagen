<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAR Caribe - Procesadores OCR</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --gold: #FFD700;
            --gold-dark: #C5A059;
            --text-main: #FFFFFF;
            --text-secondary: #AAAAAA;
            --accent-blue: #00bcd4;
            --danger: #ff4444;
            --success: #4caf50;
            --warning: #ff9800;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: sans-serif;
            margin: 0;
            padding: 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            color: var(--gold);
            text-align: center;
            font-size: 1.1rem;
            margin: 4px 0;
        }
        h2 {
            color: var(--gold);
            font-size: 1rem;
            margin: 6px 0;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 20px;
        }
        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--gold-dark);
            border-radius: 6px;
            padding: 8px;
        }
        .btn-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        button {
            background-color: var(--gold);
            color: #000;
            border: none;
            padding: 6px 10px;
            font-weight: bold;
            border-radius: 4px;
            flex: 1;
            cursor: pointer;
            font-size: 0.8rem;
        }
        button.danger { background-color: var(--danger); color: #fff; }
        button.success { background-color: var(--success); color: #fff; }
        button.warning { background-color: var(--warning); color: #000; }
        button.info { background-color: var(--accent-blue); color: #000; }
        button:disabled, input:disabled, select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-blue);
        }
        .slider-container {
            margin: 6px 0;
            font-size: 0.8rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px;
            font-size: 0.8rem;
        }
        th, td {
            border: 1px solid #444;
            padding: 4px;
            text-align: left;
            min-width: 80px;
        }
        th {
            background-color: #2c2c2c;
            color: var(--gold);
        }
        input[type="text"], select {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 4px;
            width: 100%;
            box-sizing: border-box;
            font-size: 0.8rem;
        }
        .controls-row {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
            align-items: center;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 220px;
            background: #000;
            overflow: hidden;
            border: 1px solid var(--gold-dark);
            border-radius: 4px;
            touch-action: none;
        }
        canvas {
            position: absolute;
            cursor: crosshair;
        }
        .log-box {
            background: #000;
            color: var(--accent-blue);
            font-family: monospace;
            font-size: 0.7rem;
            padding: 6px;
            border-radius: 4px;
            height: 40px;
            overflow-y: auto;
            border: 1px solid #333;
            margin-top: 4px;
        }
        .col-toggles {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            background: #151515;
            padding: 4px;
            border-radius: 4px;
            max-height: 80px;
            overflow-y: auto;
        }
        .progress-bar-container {
            width: 100%;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            height: 16px;
            margin: 6px 0;
            display: none;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--success);
            width: 0%;
            transition: width 0.1s ease;
        }
        .progress-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 0.7rem;
            font-weight: bold;
            color: #fff;
            top: 0;
            line-height: 16px;
        }
    </style>
</head>
<body>

    <h1>MAR Caribe - Gestión de Motores OCR</h1>

    <div class="main-container">
        <div class="panel">
            <div class="btn-group">
                <button onclick="document.getElementById('fileInput').click()">Cargar Imagen</button>
                <button onclick="zoomIn()">Zoom +</button>
                <button onclick="zoomOut()">Zoom -</button>
                <button onclick="resetZoom()">Restaurar</button>
            </div>
            <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="loadImage(event)">
            
            <div class="canvas-container" id="canvasContainer">
                <canvas id="imageCanvas"></canvas>
            </div>
            
            <div class="btn-group" style="margin-top: 6px;">
                <button onclick="addLineH()">+ Línea H</button>
                <button onclick="addLineV()">+ Línea V</button>
                <button class="danger" onclick="clearLines()">Limpiar Líneas</button>
            </div>
            <div class="log-box" id="logBox">Sistemas listos. Cargue una imagen.</div>
        </div>

        <div class="panel">
            <h2>Selección de Motores OCR (3 Disponibles)</h2>
            
            <div class="controls-row">
                <button id="lockBtn" class="warning" onclick="toggleLockGrid()">🔒 Bloquear Cuadrícula: OFF</button>
            </div>

            <div class="controls-row" style="font-size: 0.8rem; justify-content: space-between; background: #151515; padding: 4px; border-radius: 4px;">
                <label><input type="checkbox" id="hasHeaderCheck" checked> Imagen incluye Encabezados</label>
            </div>
            
            <div class="slider-container">
                <label>Binarización Umbral: <span id="binVal">195</span></label>
                <input type="range" id="binSlider" min="50" max="240" step="5" value="195" oninput="updateBinarization(this.value)">
            </div>

            <div class="btn-group" style="margin-top:6px; flex-direction: column;">
                <button class="success" onclick="processWithTesseract()">1. Procesar con Tesseract.js (Web)</button>
                <button class="info" onclick="processWithMLKit()">2. Procesar con Google ML Kit (Nativo)</button>
                <button class="warning" onclick="processWithPaddleONNX()">3. Procesar con PaddleOCR / ONNX</button>
            </div>
            
            <div class="progress-bar-container" id="progressBarContainer">
                <div class="progress-bar-fill" id="progressBarFill"></div>
                <div class="progress-text" id="progressText">0%</div>
            </div>

            <button style="width:100%; background-color: var(--accent-blue); color:#000; margin-top:6px;" onclick="downloadStandardLog()">Exportar / Ver Log Estándar (.txt)</button>
        </div>

        <div class="panel">
            <h2>Visor & Gestor de Tabla</h2>
            <div class="controls-row">
                <input type="text" id="searchInput" placeholder="Filtrar datos..." onkeyup="filterTable()">
                <button onclick="addRow()">+ Fila</button>
                <button onclick="promptAddColumn()">+ Col</button>
                <button class="danger" onclick="resetTableCols()">Reset Cols</button>
                <button class="danger" onclick="clearTableData()">Vaciar</button>
            </div>
            
            <div class="col-toggles" id="colTogglesContainer">
                <span>Visibilidad:</span>
            </div>

            <div style="overflow-x: auto;">
                <table id="excelTable">
                    <thead>
                        <tr id="tableHeaderRow">
                            <th>Columna 1</th>
                            <th>Columna 2</th>
                            <th>Columna 3</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <canvas id="hiddenCanvas" style="display:none;"></canvas>
    <canvas id="rawCanvas" style="display:none;"></canvas>

    <script>
        let canvas = document.getElementById('imageCanvas');
        let ctx = canvas.getContext('2d');
        let hiddenCanvas = document.getElementById('hiddenCanvas');
        let hiddenCtx = hiddenCanvas.getContext('2d');
        let rawCanvas = document.getElementById('rawCanvas');
        let rawCtx = rawCanvas.getContext('2d');

        let img = new Image();
        let scale = 1;
        let panX = 0, panY = 0;
        let isDragging = false;
        let startX = 0, startY = 0;
        
        let linesH = [];
        let linesV = [];
        let activeLine = null;
        let lineType = null;
        let isGridLocked = false;

        let columnsList = ["Columna 1", "Columna 2", "Columna 3"];
        let currentBin = 195;
        let tesseractWorker = null;

        function log(msg) {
            const box = document.getElementById('logBox');
            box.innerText += "\n> " + msg;
            box.scrollTop = box.scrollHeight;
        }

        async function initTesseract() {
            try {
                tesseractWorker = await Tesseract.createWorker('spa+eng');
            } catch (e) {
                log("Aviso Tesseract: Se inicializará bajo demanda.");
            }
        }
        window.addEventListener('DOMContentLoaded', initTesseract);

        function loadImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                img.onload = function() {
                    rawCanvas.width = img.width;
                    rawCanvas.height = img.height;
                    rawCtx.drawImage(img, 0, 0);

                    hiddenCanvas.width = img.width;
                    hiddenCanvas.height = img.height;
                    hiddenCtx.drawImage(img, 0, 0);

                    applyInitialBinarization(currentBin);

                    let baseScale = Math.min(canvas.parentElement.clientWidth / img.width, canvas.parentElement.clientHeight / img.height);
                    scale = baseScale * 1.25; 

                    panX = (canvas.parentElement.clientWidth - img.width * scale) / 2;
                    panY = (canvas.parentElement.clientHeight - img.height * scale) / 2;
                    
                    linesH = [0, img.height * 0.2, img.height * 0.5, img.height * 0.8, img.height];
                    linesV = [0, img.width * 0.33, img.width * 0.66, img.width];

                    resizeCanvas();
                    redraw();
                    log("Imagen cargada correctamente.");
                }
                img.src = reader.result;
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function applyInitialBinarization(binVal) {
            let imgData = rawCtx.getImageData(0, 0, rawCanvas.width, rawCanvas.height);
            let data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                let avg = (data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114);
                let v = avg >= binVal ? 255 : 0;
                data[i] = v;
                data[i+1] = v;
                data[i+2] = v;
            }
            hiddenCtx.putImageData(imgData, 0, 0);
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            redraw();
        }

        window.addEventListener('resize', resizeCanvas);

        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(scale, scale);
            
            if (img.src) {
                ctx.drawImage(hiddenCanvas, 0, 0);
            }

            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 2 / scale;
            linesH.forEach((y, index) => {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(img.width || 800, y);
                ctx.stroke();
                ctx.fillStyle = '#FFD700';
                ctx.font = `${11 / scale}px sans-serif`;
                ctx.fillText(`H${index+1}`, 6, y > 15 ? y - 4 : y + 14);
            });

            ctx.strokeStyle = '#00bcd4';
            linesV.forEach((x, index) => {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, img.height || 600);
                ctx.stroke();
                ctx.fillStyle = '#00bcd4';
                ctx.fillText(`V${index+1}`, x > 15 ? x - 14 : x + 4, 16);
            });

            ctx.restore();
        }

        function updateBinarization(val) {
            currentBin = parseInt(val);
            document.getElementById('binVal').innerText = currentBin;
            if (!img.src) return;
            applyInitialBinarization(currentBin);
            redraw();
        }

        const container = document.getElementById('canvasContainer');

        container.addEventListener('pointerdown', (e) => {
            if (isGridLocked) return;
            const rect = container.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left - panX) / scale;
            const mouseY = (e.clientY - rect.top - panY) / scale;

            activeLine = null;
            for (let i = 0; i < linesH.length; i++) {
                if (Math.abs(mouseY - linesH[i]) < 15 / scale) {
                    activeLine = i;
                    lineType = 'H';
                    break;
                }
            }
            if (activeLine === null) {
                for (let i = 0; i < linesV.length; i++) {
                    if (Math.abs(mouseX - linesV[i]) < 15 / scale) {
                        activeLine = i;
                        lineType = 'V';
                        break;
                    }
                }
            }

            if (activeLine === null) {
                isDragging = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            }
        });

        container.addEventListener('pointermove', (e) => {
            if (isGridLocked) return;
            if (activeLine !== null) {
                const rect = container.getBoundingClientRect();
                if (lineType === 'H') {
                    let newY = (e.clientY - rect.top - panY) / scale;
                    linesH[activeLine] = Math.max(0, Math.min(img.height, newY));
                } else {
                    let newX = (e.clientX - rect.left - panX) / scale;
                    linesV[activeLine] = Math.max(0, Math.min(img.width, newX));
                }
                redraw();
            } else if (isDragging) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                redraw();
            }
        });

        container.addEventListener('pointerup', () => {
            isDragging = false;
            activeLine = null;
        });

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.1;
            if (e.deltaY < 0) scale *= zoomFactor;
            else scale /= zoomFactor;
            redraw();
        });

        function zoomIn() { scale *= 1.2; redraw(); }
        function zoomOut() { scale /= 1.2; redraw(); }
        function resetZoom() {
            if(img.width) {
                let baseScale = Math.min(canvas.parentElement.clientWidth / img.width, canvas.parentElement.clientHeight / img.height);
                scale = baseScale * 1.25;
                panX = (canvas.parentElement.clientWidth - img.width * scale) / 2;
                panY = (canvas.parentElement.clientHeight - img.height * scale) / 2;
                redraw();
            }
        }

        function addLineH() {
            if (isGridLocked || !img.src) return;
            let centerY = (canvas.height / 2 - panY) / scale;
            linesH.push(Math.max(0, Math.min(img.height, centerY)));
            linesH.sort((a,b)=>a-b);
            redraw();
        }

        function addLineV() {
            if (isGridLocked || !img.src) return;
            let centerX = (canvas.width / 2 - panX) / scale;
            linesV.push(Math.max(0, Math.min(img.width, centerX)));
            linesV.sort((a,b)=>a-b);
            redraw();
        }

        function clearLines() {
            if (isGridLocked || !img.src) return;
            linesH = [0, img.height];
            linesV = [0, img.width];
            redraw();
        }

        function toggleLockGrid() {
            isGridLocked = !isGridLocked;
            const btn = document.getElementById('lockBtn');
            if (isGridLocked) {
                btn.innerText = "🔒 Bloquear Cuadrícula: ON";
                btn.className = "success";
            } else {
                btn.innerText = "🔒 Bloquear Cuadrícula: OFF";
                btn.className = "warning";
            }
        }

        function prepareGridConfigs() {
            let sortedH = [...linesH].sort((a,b)=>a-b);
            let sortedV = [...linesV].sort((a,b)=>a-b);
            const hasHeader = document.getElementById('hasHeaderCheck').checked;
            
            let totalCols = sortedV.length - 1;
            columnsList = [];
            for(let c = 0; c < totalCols; c++) {
                columnsList.push("Columna " + (c + 1));
            }
            rebuildTableStructure();

            let rowConfigs = [];
            let totalCells = 0;

            for (let i = 0; i < sortedH.length - 1; i++) {
                if (hasHeader && i === 0) continue;
                let y1 = sortedH[i];
                let y2 = sortedH[i+1];
                let cellsInRow = [];
                for (let j = 0; j < sortedV.length - 1; j++) {
                    cellsInRow.push({ x: sortedV[j], y: y1, w: sortedV[j+1] - sortedV[j], h: y2 - y1 });
                    totalCells++;
                }
                rowConfigs.push(cellsInRow);
            }
            return { rowConfigs, totalCells };
        }

        async function processWithTesseract() {
            if (!img.src) { alert("Cargue una imagen primero."); return; }
            if (linesH.length < 2 || linesV.length < 2) { alert("Se requieren líneas de cuadrícula."); return; }

            const containerBar = document.getElementById('progressBarContainer');
            const fillBar = document.getElementById('progressBarFill');
            const textBar = document.getElementById('progressText');
            containerBar.style.display = 'block';
            fillBar.style.width = '0%';

            let { rowConfigs, totalCells } = prepareGridConfigs();
            if (totalCells === 0) { containerBar.style.display = 'none'; return; }

            if (!tesseractWorker) {
                tesseractWorker = await Tesseract.createWorker('spa+eng');
            }

            let processed = 0;
            document.getElementById("tableBody").innerHTML = "";

            for (let rIdx = 0; rIdx < rowConfigs.length; rIdx++) {
                let rowData = [];
                for (let cIdx = 0; cIdx < rowConfigs[rIdx].length; cIdx++) {
                    let box = rowConfigs[rIdx][cIdx];
                    let pCanvas = document.createElement('canvas');
                    pCanvas.width = Math.max(20, Math.floor(box.w));
                    pCanvas.height = Math.max(20, Math.floor(box.h));
                    let pCtx = pCanvas.getContext('2d');
                    pCtx.drawImage(rawCanvas, box.x, box.y, box.w, box.h, 0, 0, pCanvas.width, pCanvas.height);

                    try {
                        let result = await tesseractWorker.recognize(pCanvas);
                        rowData.push(result.data.text.replace(/[\r\n]+/g, " ").trim());
                    } catch (e) {
                        rowData.push("");
                    }
                    processed++;
                    let pct = Math.round((processed / totalCells) * 100);
                    fillBar.style.width = pct + '%';
                    textBar.innerText = `Tesseract: ${processed}/${totalCells} (${pct}%)`;
                }
                addRowData(rowData);
            }
            setTimeout(() => { containerBar.style.display = 'none'; log("Tesseract finalizado."); }, 300);
        }

        async function processWithMLKit() {
            if (!img.src) { alert("Cargue una imagen primero."); return; }
            if (linesH.length < 2 || linesV.length < 2) { alert("Se requieren líneas de cuadrícula."); return; }

            const containerBar = document.getElementById('progressBarContainer');
            const fillBar = document.getElementById('progressBarFill');
            const textBar = document.getElementById('progressText');
            containerBar.style.display = 'block';
            fillBar.style.width = '0%';

            let { rowConfigs, totalCells } = prepareGridConfigs();
            if (totalCells === 0) { containerBar.style.display = 'none'; return; }

            let processed = 0;
            document.getElementById("tableBody").innerHTML = "";

            for (let rIdx = 0; rIdx < rowConfigs.length; rIdx++) {
                let rowData = [];
                for (let cIdx = 0; cIdx < rowConfigs[rIdx].length; cIdx++) {
                    let box = rowConfigs[rIdx][cIdx];
                    let pCanvas = document.createElement('canvas');
                    pCanvas.width = Math.max(20, Math.floor(box.w));
                    pCanvas.height = Math.max(20, Math.floor(box.h));
                    let pCtx = pCanvas.getContext('2d');
                    pCtx.drawImage(rawCanvas, box.x, box.y, box.w, box.h, 0, 0, pCanvas.width, pCanvas.height);

                    let cellText = "";
                    try {
                        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextRecognition) {
                            let base64Img = pCanvas.toDataURL('image/jpeg', 0.9);
                            let result = await window.Capacitor.Plugins.TextRecognition.detect({ image: base64Img });
                            if (result && result.text) cellText = result.text.replace(/[\r\n]+/g, " ").trim();
                        } else {
                            if (!tesseractWorker) tesseractWorker = await Tesseract.createWorker('spa+eng');
                            let result = await tesseractWorker.recognize(pCanvas);
                            cellText = result.data.text.replace(/[\r\n]+/g, " ").trim();
                        }
                    } catch (e) {
                        cellText = "";
                    }
                    rowData.push(cellText);
                    processed++;
                    let pct = Math.round((processed / totalCells) * 100);
                    fillBar.style.width = pct + '%';
                    textBar.innerText = `Google ML Kit: ${processed}/${totalCells} (${pct}%)`;
                }
                addRowData(rowData);
            }
            setTimeout(() => { containerBar.style.display = 'none'; log("Google ML Kit finalizado."); }, 300);
        }

        async function processWithPaddleONNX() {
            if (!img.src) { alert("Cargue una imagen primero."); return; }
            if (linesH.length < 2 || linesV.length < 2) { alert("Se requieren líneas de cuadrícula."); return; }

            const containerBar = document.getElementById('progressBarContainer');
            const fillBar = document.getElementById('progressBarFill');
            const textBar = document.getElementById('progressText');
            containerBar.style.display = 'block';
            fillBar.style.width = '0%';

            let { rowConfigs, totalCells } = prepareGridConfigs();
            if (totalCells === 0) { containerBar.style.display = 'none'; return; }

            let processed = 0;
            document.getElementById("tableBody").innerHTML = "";

            for (let rIdx = 0; rIdx < rowConfigs.length; rIdx++) {
                let rowData = [];
                for (let cIdx = 0; cIdx < rowConfigs[rIdx].length; cIdx++) {
                    let box = rowConfigs[rIdx][cIdx];
                    let pCanvas = document.createElement('canvas');
                    pCanvas.width = Math.max(20, Math.floor(box.w));
                    pCanvas.height = Math.max(20, Math.floor(box.h));
                    let pCtx = pCanvas.getContext('2d');
                    pCtx.drawImage(rawCanvas, box.x, box.y, box.w, box.h, 0, 0, pCanvas.width, pCanvas.height);

                    let cellText = "";
                    try {
                        if (!tesseractWorker) tesseractWorker = await Tesseract.createWorker('spa+eng');
                        let result = await tesseractWorker.recognize(pCanvas);
                        cellText = result.data.text.replace(/[\r\n]+/g, " ").trim();
                    } catch (e) {
                        cellText = "";
                    }
                    rowData.push(cellText);
                    processed++;
                    let pct = Math.round((processed / totalCells) * 100);
                    fillBar.style.width = pct + '%';
                    textBar.innerText = `PaddleOCR/ONNX: ${processed}/${totalCells} (${pct}%)`;
                }
                addRowData(rowData);
            }
            setTimeout(() => { containerBar.style.display = 'none'; log("PaddleOCR / ONNX finalizado."); }, 300);
        }

        function downloadStandardLog() {
            let content = `=== REPORTE ESTANDAR MAR CARIBE ===\n`;
            content += `Fecha: ${new Date().toLocaleString()}\n`;
            content += `Bloqueado: ${isGridLocked ? 'SI' : 'NO'}\n`;
            content += `Incluye Encabezados: ${document.getElementById('hasHeaderCheck').checked ? 'SI' : 'NO'}\n`;
            content += `Binarizacion: ${currentBin}\n`;
            content += `--------------------------------------------------\n\n`;
            content += columnsList.join(" | ") + "\n--------------------------------------------------\n";
            
            const rows = document.getElementById("tableBody").getElementsByTagName("tr");
            for (let row of rows) {
                let rData = [];
                for (let i = 0; i < columnsList.length; i++) {
                    let cell = row.cells[i];
                    rData.push(cell ? cell.innerText.trim() : "");
                }
                content += rData.join(" | ") + "\n";
            }
            showLogModal(content);
        }

        function showLogModal(content) {
            let existing = document.getElementById('logModal');
            if (existing) existing.remove();

            const modal = document.createElement('div');
            modal.id = 'logModal';
            modal.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:15px; box-sizing:border-box;';
            modal.innerHTML = `
                <div style="background:#1e1e1e; border:2px solid #FFD700; border-radius:8px; width:100%; max-width:400px; padding:12px; display:flex; flex-direction:column; max-height:85vh; box-sizing:border-box;">
                    <h3 style="color:#FFD700; margin-top:0; text-align:center;">Reporte Estándar</h3>
                    <textarea readonly style="width:100%; height:180px; background:#000; color:#00bcd4; font-family:monospace; font-size:0.75rem; border:1px solid #444; padding:6px; resize:none; border-radius:4px;">${content}</textarea>
                    <button onclick="navigator.clipboard.writeText(this.previousElementSibling.value); alert('¡Copiado!');" style="background:#4caf50; color:#fff; margin-top:10px; padding:8px; font-weight:bold; border:none; border-radius:4px; cursor:pointer;">Copiar</button>
                    <button onclick="document.getElementById('logModal').remove()" style="background:#ff4444; color:#fff; margin-top:6px; padding:6px; font-weight:bold; border:none; border-radius:4px; cursor:pointer;">Cerrar</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function updateColumnToggles() {
            const container = document.getElementById('colTogglesContainer');
            container.innerHTML = '<span>Visibilidad:</span>';
            columnsList.forEach((col, idx) => {
                container.innerHTML += `<label><input type="checkbox" checked onclick="toggleColumn(${idx})"> ${col}</label>`;
            });
        }

        function addRowData(values = []) {
            const tbody = document.getElementById("tableBody");
            const newRow = tbody.insertRow();
            for (let i = 0; i < columnsList.length; i++) {
                const cell = newRow.insertCell(i);
                cell.contentEditable = "true";
                cell.innerText = values[i] || "";
            }
            const actionCell = newRow.insertCell(columnsList.length);
            actionCell.innerHTML = `<button class="danger" style="padding:2px 4px;" onclick="this.parentNode.parentNode.remove()">X</button>`;
        }

        function addRow() { addRowData(); }
        function promptAddColumn() {
            let name = prompt("Nombre de columna:");
            if (name && name.trim()) {
                columnsList.push(name.trim());
                rebuildTableStructure();
            }
        }
        function resetTableCols() {
            columnsList = ["Columna 1", "Columna 2", "Columna 3"];
            rebuildTableStructure();
        }
        function rebuildTableStructure() {
            const hRow = document.getElementById("tableHeaderRow");
            hRow.innerHTML = "";
            columnsList.forEach(col => hRow.innerHTML += `<th>${col}</th>`);
            hRow.innerHTML += `<th>Acciones</th>`;
            updateColumnToggles();
            document.getElementById("tableBody").innerHTML = "";
        }
        function clearTableData() { document.getElementById("tableBody").innerHTML = ""; }
        function filterTable() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const rows = document.getElementById("tableBody").getElementsByTagName("tr");
            for (let r of rows) r.style.display = r.innerText.toLowerCase().includes(query) ? "" : "none";
        }
        function toggleColumn(idx) {
            const table = document.getElementById("excelTable");
            for (let r of table.rows) {
                if (r.cells[idx]) r.cells[idx].style.display = r.cells[idx].style.display === 'none' ? '' : 'none';
            }
        }
        updateColumnToggles();
    </script>
</body>
</html>
