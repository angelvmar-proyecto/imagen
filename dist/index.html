<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imagen OCR</title>
  <style>
    body { font-family: sans-serif; padding: 15px; background: #fafafa; margin: 0; }
    h1 { font-size: 20px; margin: 10px 0; }
    button { padding: 15px 30px; font-size: 16px; margin: 5px 0; width: 100%; }
    #estado { color: #666; margin-top: 10px; font-size: 14px; }

    /* Barra de progreso */
    #barraContenedor {
      width: 100%;
      height: 24px;
      background: #e0e0e0;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 15px;
      display: none;
    }
    #barraProgreso {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4CAF50, #8BC34A);
      border-radius: 12px;
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }
    #barraTexto {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }

    /* Tabla estilo Excel */
    #tablaContenedor {
      margin-top: 20px;
      overflow: auto;
      border: 1px solid #ccc;
      border-radius: 4px;
      max-height: 60vh;
      display: none;
    }
    #tablaResultado {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
      font-family: 'Courier New', monospace;
    }
    #tablaResultado td {
      border: 1px solid #ddd;
      padding: 6px 8px;
      vertical-align: top;
      white-space: pre-wrap;
    }
    #tablaResultado tr:nth-child(even) {
      background: #f9f9f9;
    }
    #tablaResultado .col-num {
      background: #f0f0f0;
      color: #888;
      text-align: center;
      width: 40px;
      font-weight: bold;
    }

    /* Texto plano de respaldo */
    #resultado {
      white-space: pre-wrap;
      background: #f0f0f0;
      padding: 10px;
      margin-top: 10px;
      font-size: 12px;
      max-height: 30vh;
      overflow: auto;
      display: none;
    }

    /* Debug */
    #debug {
      white-space: pre-wrap;
      background: #ffe0e0;
      padding: 10px;
      margin-top: 10px;
      font-size: 11px;
      color: #a00;
      max-height: 30vh;
      overflow: auto;
      display: none;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-DtmlQ6-b.js"></script>
</head>
<body>
  <h1>OCR Timeshare</h1>
  <button id="btnCamara">📷 Tomar Foto</button>
  <button id="btnGaleria">🖼️ Elegir de Galería</button>
  <div id="estado">Cargando...</div>

  <!-- Barra de progreso -->
  <div id="barraContenedor">
    <div id="barraProgreso">0%</div>
  </div>
  <div id="barraTexto"></div>

  <!-- Tabla estilo Excel -->
  <div id="tablaContenedor">
    <table id="tablaResultado">
      <tbody></tbody>
    </table>
  </div>

  <!-- Resultado en texto plano (respaldo) -->
  <div id="resultado"></div>

  <!-- Debug -->
  <div id="debug"></div>

  <script>
    window.addEventListener('error', (e) => {
      const dbg = document.getElementById('debug');
      if (dbg) {
        dbg.style.display = 'block';
        dbg.textContent += `[ERROR GLOBAL] ${e.message}\n  en ${e.filename}:${e.lineno}\n\n`;
      }
    });
    window.addEventListener('unhandledrejection', (e) => {
      const dbg = document.getElementById('debug');
      if (dbg) {
        dbg.style.display = 'block';
        dbg.textContent += `[PROMESA] ${e.reason}\n\n`;
      }
    });
  </script>
  <script src="js/config-deteccion.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/preprocesamiento.js"></script>
  <script src="js/deteccion.js"></script>
  <script src="js/lidar.js"></script>
  <script src="js/retina.js"></script>
</body>
</html>
