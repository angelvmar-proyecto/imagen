name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v4

    - name: ⚙️ Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: ☕ Configurar Java (JDK 17)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 📦 Instalar dependencias y Capacitor
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/camera @capacitor/clipboard
        npx cap init --force || true

    - name: 🤖 Sincronizar plataforma Android (Android 14)
      run: |
        npx cap add android || true
        npx cap sync android

    - name: 🔨 Compilar APK con Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: 📤 Subir artefacto APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

