name: Compilar MAR Caribe APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Obtener código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: ☕ Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 📦 Instalar dependencias
        run: npm install

      - name: 🔄 Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: 📁 Copiar modelos a ruta de assets
        run: |
          mkdir -p android/app/src/main/assets/public/models
          cp android/app/src/main/assets/models/* android/app/src/main/assets/public/models/ || true

      - name: 🔧 Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: 🏗️ Compilar APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: 📤 Subir APK final
        uses: actions/upload-artifact@v4
        with:
          name: MAR-Caribe-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
