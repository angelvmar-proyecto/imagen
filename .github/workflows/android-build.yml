name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Clonar código
      uses: actions/checkout@v4

    - name: 🟢 Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: ☕ Configurar Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 📦 Instalar dependencias
      run: npm ci

    - name: 📱 Agregar plataforma Android
      run: npx cap add android

    - name: 🔧 Sincronizar código con Android
      run: npx cap sync android

    - name: ⚙️ Configurar Android 32-bit (armeabi-v7a)
      run: |
        sed -i '/defaultConfig {/a\        ndk {\n            abiFilters "armeabi-v7a"\n        }' android/app/build.gradle
        cat android/app/build.gradle | grep -A 5 "ndk {"

    - name: 🔨 Compilar APK Release
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: 📤 Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: MAR-Caribe-Escaner-Tablas
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
