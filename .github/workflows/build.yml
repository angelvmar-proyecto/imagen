name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies & CLI
        run: |
          npm install
          npm install -g @capacitor/cli

      - name: Build & Sync Capacitor Project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          # Copia forzada de respaldo para evitar pantalla blanca o refusal
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/

      - name: Inject Native Handlers
        run: |
          python3 -c "
          import os

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  content = f.read()
              intent = '''
                          <intent-filter>
                              <action android:name=\"android.intent.action.SEND\" />
                              <category android:name=\"android.intent.category.DEFAULT\" />
                              <data android:mimeType=\"image/*\" />
                          </intent-filter>
              '''
              if 'android.intent.action.SEND' not in content:
                  content = content.replace('</activity>', intent + '\n        </activity>')
                  with open(manifest_path, 'w') as f:
                      f.write(content)

          java_path = 'android/app/src/main/java/com/angelvmar/imagen/MainActivity.java'
          if os.path.exists(java_path):
              java_code = '''package com.angelvmar.imagen;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.util.Base64;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;

          public class MainActivity extends BridgeActivity {
              private String sharedBase64Image = null;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  handleSendIntent(getIntent());

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().setWebViewClient(new WebViewClient() {
                          @Override
                          public void onPageFinished(WebView view, String url) {
                              super.onPageFinished(view, url);
                              inyectarImagen();
                          }
                      });
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  handleSendIntent(intent);
                  inyectarImagen();
              }

              private void handleSendIntent(Intent intent) {
                  if (intent == null) return;
                  String action = intent.getAction();
                  String type = intent.getType();

                  if (Intent.ACTION_SEND.equals(action) && type != null && type.startsWith(\"image/\")) {
                      Uri imageUri = (Uri) intent.getParcelableExtra(Intent.EXTRA_STREAM);
                      if (imageUri != null) {
                          try {
                              InputStream inputStream = getContentResolver().openInputStream(imageUri);
                              ByteArrayOutputStream byteBuffer = new ByteArrayOutputStream();
                              byte[] buffer = new byte[1024];
                              int len;
                              while ((len = inputStream.read(buffer)) != -1) {
                                  byteBuffer.write(buffer, 0, len);
                              }
                              inputStream.close();
                              
                              String mime = getContentResolver().getType(imageUri);
                              if (mime == null) mime = \"image/jpeg\";
                              
                              sharedBase64Image = \"data:\" + mime + \";base64,\" + Base64.encodeToString(byteBuffer.toByteArray(), Base64.NO_WRAP);
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                      }
                  }
              }

              private void inyectarImagen() {
                  if (sharedBase64Image != null && this.bridge != null && this.bridge.getWebView() != null) {
                      final String code = \"window.sharedImageData = '\" + sharedBase64Image + \"';\" +
                                         \"if(window.cargarImagenCompartida) window.cargarImagenCompartida('\" + sharedBase64Image + \"');\";
                      this.bridge.getWebView().post(new Runnable() {
                          @Override
                          public void run() {
                              bridge.getWebView().evaluateJavascript(code, null);
                          }
                      });
                  }
              }
          }
          '''
              with open(java_path, 'w') as f:
                  f.write(java_code)
          "

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

