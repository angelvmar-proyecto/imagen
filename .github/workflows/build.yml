name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --no-package-lock
          npm install --no-save --force @rollup/rollup-linux-x64-gnu @esbuild/linux-x64

      - name: Patch ONNX plugin (compileSdk 36 + Java 21)
        run: |
          FILE="node_modules/@cantoo/capacitor-onnx/android/build.gradle"
          sed -i 's/compileSdk 34/compileSdk 36/g' "$FILE"
          sed -i 's/targetSdk 34/targetSdk 36/g' "$FILE"
          sed -i 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g' "$FILE"
          sed -i "s/jvmTarget = '17'/jvmTarget = '21'/g" "$FILE"
          echo "=== build.gradle del plugin ONNX después del parche ==="
          grep -E "compileSdk|targetSdk|JavaVersion|jvmTarget" "$FILE"

      - name: Build web (Vite)
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
