name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verificar SystemBars
        run: |
          FILE="node_modules/@capacitor/android/capacitor/src/main/java/com/getcapacitor/plugin/SystemBars.java"
          if [ -f "$FILE" ]; then
            echo "✅ SystemBars.java existe ($(wc -l < $FILE) líneas)"
          else
            echo "❌ SystemBars.java NO existe"
            exit 1
          fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: Limpiar y refrescar Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean --no-daemon
          rm -rf ~/.gradle/caches/ 2>/dev/null || true

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --refresh-dependencies

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
