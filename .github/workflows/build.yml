name: Compilar APK MAR Caribe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Obtener código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Instalar dependencias npm
        run: npm install

      - name: 🔄 Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: 🔧 Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: 🏗️ Compilar APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Subir APK final
        uses: actions/upload-artifact@v4
        with:
          name: MAR-Caribe-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

