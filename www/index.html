<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAR Caribe — OCR Tablas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>📊 MAR Caribe — 10 Pasos</h1>
</header>

<div class="tabs">
  <div class="tab active" data-tab="ocr">📷 Imagen</div>
  <div class="tab" data-tab="proceso">🔧 Proceso</div>
  <div class="tab" data-tab="tabla">📊 Tabla</div>
  <div class="tab" data-tab="historial">📋 Historial</div>
</div>

<!-- TAB IMAGEN -->
<div class="tab-content active" id="tab-ocr">
  <div class="upload-box" id="dropZone">
    <div class="upload-icon">📷</div>
    <p class="upload-text">Toca para seleccionar imagen</p>
    <p class="upload-sub">Tesseract.js v5 · 10 Pasos</p>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="preview-container" id="previewContainer">
    <div class="zoom-wrapper" id="zoomWrapper">
      <div class="zoom-content" id="zoomContent">
        <img id="imgPreview" class="preview-img" alt="Vista previa">
        <canvas id="deteccionCanvas" class="grid-canvas"></canvas>
      </div>
    </div>
    <div class="zoom-controls">
      <button class="zoom-btn" id="btnZoomIn">+</button>
      <button class="zoom-btn" id="btnZoomOut">−</button>
      <button class="zoom-btn" id="btnToggleLineas">👁️</button>
      <button class="zoom-btn" id="btnZoomReset">↺</button>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn btn-primary btn-sm" id="btnCamera">📷 Cámara</button>
    <button class="btn btn-danger btn-sm" id="btnLimpiar">🗑️ Limpiar</button>
  </div>

  <div class="progress-container" id="progressWrapper">
    <div class="progress-bar" id="progressFill">0%</div>
  </div>
  <div id="progressStep" class="progress-step"></div>

  <div id="statusText" class="status info">📷 Carga una imagen</div>
</div>

<!-- TAB PROCESO -->
<div class="tab-content" id="tab-proceso">
  <div class="pasos-container">
    <div class="paso-item">
      <button class="btn-paso" id="btn-paso1">🧹 1. Mediana</button>
      <span class="estado" id="estado-paso1">⏳</span>
    </div>
    <div class="paso-item">
      <button class="btn-paso" id="btn-paso2">🎨 2. Canales</button>
      <span class="estado" id="estado-paso2">⏳</span>
    </div>
    <div class="paso-item">
      <button class="btn-paso" id="btn-paso3">🔭 3. Óptica Aérea</button>
      <span class="estado" id="estado-paso3">⏳</span>
    </div>
    <div class="paso-item">
      <button class="btn-paso" id="btn-paso4">🔊 4. Ecografía</button>
      <span class="estado" id="estado-paso4">⏳</span>
    </div>
    <div class="paso-item">
      <button class="btn-paso" id="btn-paso5">📡 5. Espectro</button>
      <span class="estado" id="estado-paso5">⏳</span>
    </div>
    <div class="paso-item">
      <button class="btn-paso" id="btn-paso6">📐 6. LIDAR</button>
      <span class="estado" id="estado-paso6">⏳</span>
    </div>
    <div class="paso-item">
      <button class="btn-paso" id="btn-paso7">✏️ 7. Edición</button>
      <span class="estado" id="estado-paso7">⏳</span>
    </div>
    <div class="paso-item">
      <button class="btn-paso" id="btn-paso8">✂️ 8. Recorte</button>
      <span class="estado" id="estado-paso8">⏳</span>
    </div>
    <div class="paso-item">
      <button class="btn-paso" id="btn-paso9">📄 9. OCR</button>
      <span class="estado" id="estado-paso9">⏳</span>
    </div>
    <div class="paso-item">
      <button class="btn-paso" id="btn-paso10">🎓 10. Aprendizaje</button>
      <span class="estado" id="estado-paso10">⏳</span>
    </div>
  </div>

  <button class="btn btn-success" id="btnEjecutarTodo" style="margin-top:16px;">
    🚀 EJECUTAR TODO
  </button>

  <div class="debug-panel" id="debugPanel"></div>
</div>

<!-- TAB TABLA -->
<div class="tab-content" id="tab-tabla">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Buscar...">
    <button class="btn btn-primary btn-sm" id="btnBuscar">Buscar</button>
  </div>
  <div id="tableWrapper">
    <div class="empty-state">📊 Sin datos</div>
  </div>
  <div class="btn-group">
    <button class="btn btn-primary btn-sm" id="btnCopiarTabla">📋 Copiar</button>
    <button class="btn btn-csv btn-sm" id="btnExportarCSV">📊 CSV</button>
    <button class="btn btn-excel btn-sm" id="btnExportarExcel">📈 Excel</button>
  </div>
  <div class="info-extra" id="infoExtra">📊 0 filas</div>
</div>

<!-- TAB HISTORIAL -->
<div class="tab-content" id="tab-historial">
  <div id="listaHistorial"></div>
</div>

<footer>MAR Caribe v6.1 · 10 Pasos · Tesseract.js v5</footer>

<script src="tesseract/tesseract.min.js"></script>
<script src="js/tabs.js"></script>
<script src="js/app.js"></script>
<script src="js/pasos/debug.js"></script>
<script src="js/pasos/paso1-mediana.js"></script>
<script src="js/pasos/paso2-canales.js"></script>
<script src="js/pasos/paso3-optica.js"></script>
<script src="js/pasos/paso4-ecografia.js"></script>
<script src="js/pasos/paso5-espectro.js"></script>
<script src="js/pasos/paso6-lidar.js"></script>
<script src="js/pasos/paso7-edicion.js"></script>
<script src="js/pasos/paso8-recorte.js"></script>
<script src="js/pasos/paso9-ocr.js"></script>
<script src="js/pasos/paso10-aprendizaje.js"></script>
<script src="js/pasos/conectar-botones.js"></script>

</body>
</html>
