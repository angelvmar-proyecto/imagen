<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAR Caribe - Visor y OCR Local</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app-container">
        <header>
            <h2>Procesador Local - Tablas & Texto</h2>
        </header>
        <main>
            <div id="toolbar">
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
                <button id="btnLoadImage">Cargar Imagen WhatsApp</button>
                <button id="btnAddHLine">+ Fila</button>
                <button id="btnAddVLine">+ Columna</button>
                <button id="btnClearLines">Limpiar Líneas</button>
            </div>
            <div id="viewer-container">
                <canvas id="imageCanvas"></canvas>
            </div>
            <div id="controls-container">
                <h3>Parámetros de Inferencia & Líneas</h3>
                <div class="control-group">
                    <label>YOLOv11 Confianza: <span id="yoloConfVal">0.5</span></label>
                    <input type="range" id="yoloConf" min="0.1" max="1.0" step="0.05" value="0.5">
                </div>
                <div class="control-group">
                    <label>PaddleOCR Umbral: <span id="ocrThreshVal">0.6</span></label>
                    <input type="range" id="ocrThresh" min="0.1" max="1.0" step="0.05" value="0.6">
                </div>
                <button id="btnExportLog">Descargar Log Estándar (.txt)</button>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
