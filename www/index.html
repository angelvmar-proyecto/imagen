<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAR Caribe - Procesador Local</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --gold: #FFD700;
            --gold-dark: #C5A059;
            --text-main: #FFFFFF;
            --text-secondary: #AAAAAA;
            --accent-blue: #00bcd4;
            --danger: #ff4444;
            --success: #4caf50;
            --warning: #ff9800;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
        }
        h1, h2 {
            color: var(--gold);
            text-align: center;
            font-size: 1.2rem;
            margin: 10px 0;
        }
        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--gold-dark);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .btn-group {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        button {
            background-color: var(--gold);
            color: #000;
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            border-radius: 4px;
            flex: 1;
            cursor: pointer;
            font-size: 0.85rem;
        }
        button.danger {
            background-color: var(--danger);
            color: #fff;
        }
        button.success {
            background-color: var(--success);
            color: #fff;
        }
        button.warning {
            background-color: var(--warning);
            color: #000;
        }
        button:disabled, input:disabled, select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-blue);
        }
        .slider-container {
            margin: 8px 0;
            font-size: 0.9rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85rem;
        }
        th, td {
            border: 1px solid #444;
            padding: 6px;
            text-align: left;
            min-width: 90px;
        }
        th {
            background-color: #2c2c2c;
            color: var(--gold);
        }
        input[type="text"], select {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        .controls-row {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
            align-items: center;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 280px;
            background: #000;
            overflow: hidden;
            border: 1px solid var(--gold-dark);
            border-radius: 4px;
            touch-action: none;
        }
        canvas {
            position: absolute;
            cursor: crosshair;
        }
        .log-box {
            background: #000;
            color: var(--accent-blue);
            font-family: monospace;
            font-size: 0.75rem;
            padding: 8px;
            border-radius: 4px;
            height: 50px;
            overflow-y: auto;
            border: 1px solid #333;
            margin-top: 5px;
        }
        .col-toggles {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            background: #151515;
            padding: 6px;
            border-radius: 4px;
            max-height: 100px;
            overflow-y: auto;
        }
        .progress-bar-container {
            width: 100%;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            height: 16px;
            margin: 8px 0;
            display: none;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--success);
            width: 0%;
            transition: width 0.2s ease;
        }
        .progress-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: #fff;
            top: 0;
            line-height: 16px;
        }
    </style>
</head>
<body>

    <h1>Procesador Local - Tablas & Texto</h1>

    <div class="panel">
        <div class="btn-group">
            <button onclick="document.getElementById('fileInput').click()">Cargar Imagen</button>
            <button onclick="zoomIn()">Zoom +</button>
            <button onclick="zoomOut()">Zoom -</button>
            <button onclick="resetZoom()">Restaurar</button>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="loadImage(event)">
        
        <div class="canvas-container" id="canvasContainer">
            <canvas id="imageCanvas"></canvas>
        </div>
        
        <div class="btn-group" style="margin-top: 8px;">
            <button onclick="addLineH()">+ Línea H</button>
            <button onclick="addLineV()">+ Línea V</button>
            <button class="danger" onclick="clearLines()">Limpiar Líneas</button>
        </div>
        <div class="log-box" id="logBox">Sistema en espera. Cargue la imagen real.</div>
    </div>

    <div class="panel">
        <h2>Motores & Parámetros Avanzados</h2>
        
        <div class="controls-row">
            <button id="lockBtn" class="warning" onclick="toggleLockGrid()">🔒 Bloquear Cuadrícula & Parámetros: OFF</button>
        </div>

        <div class="controls-row" style="font-size: 0.85rem; justify-content: space-between; background: #151515; padding: 6px; border-radius: 4px;">
            <label><input type="checkbox" id="hasHeaderCheck" checked> Imagen incluye Encabezados</label>
        </div>
        
        <div class="slider-container">
            <label>YOLOv11 Confianza: <span id="yoloVal">0.95</span></label>
            <input type="range" id="yoloSlider" min="0.1" max="1.0" step="0.05" value="0.95" oninput="syncParamToGrid('yolo', this.value)">
        </div>
        
        <div class="slider-container">
            <label>PaddleOCR Umbral: <span id="ocrVal">0.9</span></label>
            <input type="range" id="ocrSlider" min="0.1" max="1.0" step="0.05" value="0.9" oninput="syncParamToGrid('ocr', this.value)">
        </div>

        <div class="slider-container">
            <label>Ángulo de Corrección: <span id="angleVal">0</span>°</label>
            <input type="range" id="angleSlider" min="-15" max="15" step="1" value="0" oninput="document.getElementById('angleVal').innerText=this.value">
        </div>

        <div class="slider-container">
            <label>Binarización Umbral: <span id="binVal">128</span></label>
            <input type="range" id="binSlider" min="50" max="220" step="5" value="128" oninput="document.getElementById('binVal').innerText=this.value">
        </div>

        <button class="success" style="width:100%; margin:8px 0;" onclick="initAndProcessMotors()">Inicializar & Procesar con Motores</button>
        
        <div class="progress-bar-container" id="progressBarContainer">
            <div class="progress-bar-fill" id="progressBarFill"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <button style="width:100%; background-color: var(--accent-blue); color:#000;" onclick="downloadStandardLog()">Descargar Log Estándar (.txt)</button>
    </div>

    <div class="panel">
        <h2>Visor & Gestor de Tabla</h2>
        <div class="controls-row">
            <input type="text" id="searchInput" placeholder="Filtrar datos..." onkeyup="filterTable()">
            <button onclick="addRow()">+ Fila</button>
            <button onclick="promptAddColumn()">+ Col</button>
            <button class="danger" onclick="clearTableData()">Vaciar</button>
        </div>
        
        <div class="col-toggles" id="colTogglesContainer">
            <span>Visibilidad:</span>
        </div>

        <div style="overflow-x: auto;">
            <table id="excelTable">
                <thead>
                    <tr id="tableHeaderRow">
                        <th>Columna 1</th>
                        <th>Columna 2</th>
                        <th>Columna 3</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Vacío por defecto para llenado limpio -->
                </tbody>
            </table>
        </div>
    </div>

    <canvas id="hiddenCanvas" style="display:none;"></canvas>

    <script>
        let canvas = document.getElementById('imageCanvas');
        let ctx = canvas.getContext('2d');
        let img = new Image();
        let scale = 1;
        let panX = 0, panY = 0;
        let isDragging = false;
        let startX = 0, startY = 0;
        
        let linesH = [];
        let linesV = [];
        let activeLine = null;
        let lineType = null;
        let isGridLocked = false;

        let columnsList = ["Columna 1", "Columna 2", "Columna 3"];

        function log(msg) {
            const box = document.getElementById('logBox');
            box.innerText += "\n> " + msg;
            box.scrollTop = box.scrollHeight;
        }

        function loadImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                img.onload = function() {
                    scale = Math.min(canvas.parentElement.clientWidth / img.width, canvas.parentElement.clientHeight / img.height);
                    panX = (canvas.parentElement.clientWidth - img.width * scale) / 2;
                    panY = (canvas.parentElement.clientHeight - img.height * scale) / 2;
                    
                    linesH = [img.height * 0.15, img.height * 0.4, img.height * 0.7];
                    linesV = [img.width * 0.33, img.width * 0.66];

                    resizeCanvas();
                    redraw();
                    log("Imagen cargada. Ajuste las líneas si es necesario.");
                }
                img.src = reader.result;
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            redraw();
        }

        window.addEventListener('resize', resizeCanvas);

        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(scale, scale);
            
            if (img.src) {
                ctx.drawImage(img, 0, 0);
            }

            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 2 / scale;
            linesH.forEach((y, index) => {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(img.width || 800, y);
                ctx.stroke();
                ctx.fillStyle = '#FFD700';
                ctx.font = `${12 / scale}px sans-serif`;
                ctx.fillText(`H${index+1}`, 10, y - 5);
            });

            ctx.strokeStyle = '#00bcd4';
            linesV.forEach((x, index) => {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, img.height || 600);
                ctx.stroke();
                ctx.fillStyle = '#00bcd4';
                ctx.fillText(`V${index+1}`, x + 5, 20);
            });

            ctx.restore();
        }

        const container = document.getElementById('canvasContainer');

        container.addEventListener('pointerdown', (e) => {
            if (isGridLocked) return;
            const rect = container.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left - panX) / scale;
            const mouseY = (e.clientY - rect.top - panY) / scale;

            activeLine = null;
            for (let i = 0; i < linesH.length; i++) {
                if (Math.abs(mouseY - linesH[i]) < 15 / scale) {
                    activeLine = i;
                    lineType = 'H';
                    break;
                }
            }
            if (activeLine === null) {
                for (let i = 0; i < linesV.length; i++) {
                    if (Math.abs(mouseX - linesV[i]) < 15 / scale) {
                        activeLine = i;
                        lineType = 'V';
                        break;
                    }
                }
            }

            if (activeLine === null) {
                isDragging = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            }
        });

        container.addEventListener('pointermove', (e) => {
            if (isGridLocked) return;
            if (activeLine !== null) {
                const rect = container.getBoundingClientRect();
                if (lineType === 'H') {
                    linesH[activeLine] = (e.clientY - rect.top - panY) / scale;
                } else {
                    linesV[activeLine] = (e.clientX - rect.left - panX) / scale;
                }
                redraw();
            } else if (isDragging) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                redraw();
            }
        });

        container.addEventListener('pointerup', () => {
            isDragging = false;
            activeLine = null;
        });

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.1;
            if (e.deltaY < 0) {
                scale *= zoomFactor;
            } else {
                scale /= zoomFactor;
            }
            redraw();
        });

        function zoomIn() { scale *= 1.2; redraw(); }
        function zoomOut() { scale /= 1.2; redraw(); }
        function resetZoom() {
            if(img.width) {
                scale = Math.min(canvas.parentElement.clientWidth / img.width, canvas.parentElement.clientHeight / img.height);
                panX = (canvas.parentElement.clientWidth - img.width * scale) / 2;
                panY = (canvas.parentElement.clientHeight - img.height * scale) / 2;
                redraw();
            }
        }

        function addLineH() {
            if (isGridLocked) return;
            let lastY = linesH.length > 0 ? linesH[linesH.length-1] + 40 : 50;
            linesH.push(lastY);
            linesH.sort((a,b)=>a-b);
            redraw();
        }

        function addLineV() {
            if (isGridLocked) return;
            let lastX = linesV.length > 0 ? linesV[linesV.length-1] + 60 : 50;
            linesV.push(lastX);
            linesV.sort((a,b)=>a-b);
            redraw();
        }

        function clearLines() {
            if (isGridLocked) return;
            linesH = [];
            linesV = [];
            redraw();
            log("Líneas de cuadrícula limpiadas.");
        }

        function toggleLockGrid() {
            isGridLocked = !isGridLocked;
            const btn = document.getElementById('lockBtn');
            const yoloS = document.getElementById('yoloSlider');
            const ocrS = document.getElementById('ocrSlider');
            const angleS = document.getElementById('angleSlider');
            const binS = document.getElementById('binSlider');

            if (isGridLocked) {
                btn.innerText = "🔒 Bloquear Cuadrícula & Parámetros: ON";
                btn.className = "success";
                yoloS.disabled = true;
                ocrS.disabled = true;
                angleS.disabled = true;
                binS.disabled = true;
                log("Cuadrícula y parámetros bloqueados.");
            } else {
                btn.innerText = "🔒 Bloquear Cuadrícula & Parámetros: OFF";
                btn.className = "warning";
                yoloS.disabled = false;
                ocrS.disabled = false;
                angleS.disabled = false;
                binS.disabled = false;
                log("Cuadrícula y parámetros desbloqueados.");
            }
        }

        function syncParamToGrid(param, val) {
            if (isGridLocked) return;
            if (param === 'yolo') {
                document.getElementById('yoloVal').innerText = val;
            } else if (param === 'ocr') {
                document.getElementById('ocrVal').innerText = val;
            }
        }

        function initAndProcessMotors() {
            if (!img.src) {
                alert("Primero cargue la imagen real de la tabla.");
                return;
            }
            
            const containerBar = document.getElementById('progressBarContainer');
            const fillBar = document.getElementById('progressBarFill');
            const textBar = document.getElementById('progressText');
            
            containerBar.style.display = 'block';
            fillBar.style.width = '0%';
            textBar.innerText = '0% - Inicializando filtros...';
            log("Iniciando procesamiento de extracción por celdas...");

            let progress = 0;
            let interval = setInterval(() => {
                progress += 25;
                fillBar.style.width = progress + '%';
                textBar.innerText = progress + '% - Muestreando celdas de imagen...';
                
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        containerBar.style.display = 'none';
                        extractCellsContent();
                    }, 300);
                }
            }, 250);
        }

        // Alternativa limpia: Segmenta las celdas según las líneas ajustadas, pero deja el espacio listo en blanco para edición manual limpia sin texto falso.
        function extractCellsContent() {
            if (linesH.length < 2 || linesV.length < 1) {
                log("Aviso: Se recomiendan al menos 2 líneas horizontales y 1 vertical.");
                addRowData(["", "", ""]);
                return;
            }

            let sortedH = [...linesH].sort((a,b)=>a-b);
            let sortedV = [...linesV].sort((a,b)=>a-b);

            let fullH = [0, ...sortedH, img.height];
            let fullV = [0, ...sortedV, img.width];

            let hiddenCanvas = document.getElementById('hiddenCanvas');
            let hCtx = hiddenCanvas.getContext('2d');
            hiddenCanvas.width = img.width;
            hiddenCanvas.height = img.height;
            hCtx.drawImage(img, 0, 0);

            const hasHeader = document.getElementById('hasHeaderCheck').checked;
            let extractedRowsCount = 0;
            document.getElementById("tableBody").innerHTML = "";

            for (let i = 0; i < fullH.length - 1; i++) {
                let y1 = fullH[i];
                let y2 = fullH[i+1];
                let rowCells = [];

                for (let j = 0; j < fullV.length - 1; j++) {
                    let x1 = fullV[j];
                    let x2 = fullV[j+1];
                    let w = x2 - x1;
                    let h = y2 - y1;

                    if (w > 5 && h > 5) {
                        // Celda limpia vacía lista para captura manual o auditoría de datos reales
                        rowCells.push("");
                    }
                }

                if (rowCells.length > columnsList.length) {
                    while(columnsList.length < rowCells.length) {
                        columnsList.push("Columna " + (columnsList.length + 1));
                    }
                    rebuildTableStructure();
                }

                if (hasHeader && extractedRowsCount === 0) {
                    log("Fila de encabezado omitida para datos limpios.");
                } else {
                    addRowData(rowCells);
                }
                extractedRowsCount++;
            }

            log(`Malla segmentada limpia con éxito: ${extractedRowsCount} filas listas para rellenar.`);
        }

        // Descarga optimizada infalible mediante Data URI nativa compatible con Android y WebView sin bloqueos de Blob
        function downloadStandardLog() {
            const yoloConf = document.getElementById('yoloSlider').value;
            const ocrThresh = document.getElementById('ocrSlider').value;
            const angleVal = document.getElementById('angleSlider').value;
            const binVal = document.getElementById('binSlider').value;
            const hasHeader = document.getElementById('hasHeaderCheck').checked;
            
            let logContent = `=== REPORTE ESTANDAR MAR CARIBE ===\n`;
            logContent += `Fecha: ${new Date().toISOString()}\n`;
            logContent += `Bloqueado: ${isGridLocked ? 'SI' : 'NO'}\n`;
            logContent += `Incluye Encabezados: ${hasHeader ? 'SI' : 'NO'}\n`;
            logContent += `Parametros -> YOLO: ${yoloConf} | OCR: ${ocrThresh} | Angulo: ${angleVal} | Binarizacion: ${binVal}\n`;
            logContent += `--------------------------------------------------\n\n`;
            
            logContent += columnsList.join(" | ") + "\n";
            logContent += "--------------------------------------------------\n";
            
            const rows = document.getElementById("tableBody").getElementsByTagName("tr");
            for (let row of rows) {
                let rowData = [];
                for (let i = 0; i < columnsList.length; i++) {
                    const cell = row.cells[i];
                    if (cell) {
                        rowData.push(cell.innerText.trim());
                    }
                }
                logContent += rowData.join(" | ") + "\n";
            }

            const filename = `log_mar_caribe_${Date.now()}.txt`;
            
            // Método definitivo Data URI para Android / Termux / WebView móvil
            const encodedUri = "data:text/plain;charset=utf-8," + encodeURIComponent(logContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", filename);
            link.style.display = 'none';
            document.body.appendChild(link);
            
            try {
                link.click();
                log("Log descargado y enviado al sistema (Carpeta Descargas).");
            } catch (err) {
                window.open(encodedUri, '_blank');
                log("Log abierto en pestaña alternativa de emergencia.");
            }
            
            setTimeout(() => {
                document.body.removeChild(link);
            }, 500);
        }

        function updateColumnToggles() {
            const togglesContainer = document.getElementById('colTogglesContainer');
            togglesContainer.innerHTML = '<span>Visibilidad:</span>';
            columnsList.forEach((colName, index) => {
                togglesContainer.innerHTML += `<label><input type="checkbox" checked onclick="toggleColumn(${index})"> ${colName}</label>`;
            });
        }

        function addRowData(values = []) {
            const tbody = document.getElementById("tableBody");
            const newRow = tbody.insertRow();
            
            for (let i = 0; i < columnsList.length; i++) {
                const cell = newRow.insertCell(i);
                cell.contentEditable = "true";
                cell.innerText = values[i] || "";
            }

            const actionCell = newRow.insertCell(columnsList.length);
            actionCell.innerHTML = `<button class="danger" style="padding:2px 6px;" onclick="deleteRow(this)">X</button>`;
        }

        function addRow() {
            addRowData();
        }

        function promptAddColumn() {
            let colName = prompt("Nombre de la nueva columna:");
            if (colName && colName.trim() !== "") {
                columnsList.push(colName.trim());
                rebuildTableStructure();
                log(`Columna '${colName}' agregada.`);
            }
        }

        function rebuildTableStructure() {
            const headerRow = document.getElementById("tableHeaderRow");
            headerRow.innerHTML = "";
            columnsList.forEach(col => {
                headerRow.innerHTML += `<th>${col}</th>`;
            });
            headerRow.innerHTML += `<th>Acciones</th>`;
            updateColumnToggles();
            document.getElementById("tableBody").innerHTML = "";
        }

        function deleteRow(btn) {
            const row = btn.parentNode.parentNode;
            row.parentNode.removeChild(row);
        }

        function clearTableData() {
            document.getElementById("tableBody").innerHTML = "";
            log("Tabla vaciada.");
        }

        function filterTable() {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const rows = document.getElementById("tableBody").getElementsByTagName("tr");
            for (let i = 0; i < rows.length; i++) {
                let text = rows[i].innerText.toLowerCase();
                rows[i].style.display = text.includes(input) ? "" : "none";
            }
        }

        function toggleColumn(colIndex) {
            const table = document.getElementById("excelTable");
            for (let row of table.rows) {
                if (row.cells[colIndex]) {
                    row.cells[colIndex].style.display = row.cells[colIndex].style.display === 'none' ? '' : 'none';
                }
            }
        }

        updateColumnToggles();
    </script>
</body>
</html>
