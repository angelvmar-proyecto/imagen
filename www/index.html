<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAR Caribe — Escáner de Tablas</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="js/tesseract/tesseract.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-container">
        <header>
            <h1>MAR Caribe — Escáner</h1>
            <span id="version-badge">v2.6 ESTABLE</span>
        </header>

        <nav class="toolbar">
            <button id="btn-cargar" class="btn">📂 Cargar</button>
            <button id="btn-editar" class="btn">✏️ Editar</button>
            <button id="btn-ocr" class="btn">📖 OCR</button>
            <button id="btn-excel" class="btn">📊 Excel</button>
            <button id="btn-guardar" class="btn">💾 Guardar</button>
            <button id="btn-log" class="btn">📋 Log</button>
            <button id="btn-nuevo" class="btn">🔄 Nuevo</button>
            <button id="btn-exportar" class="btn">📤 Exportar</button>
        </nav>

        <section class="filters-panel">
            <div class="control-group">
                <label for="range-brillo">Brillo: <span id="val-brillo">100</span>%</label>
                <input type="range" id="range-brillo" min="0" max="200" value="100">
            </div>
            <div class="control-group">
                <label for="range-contraste">Contraste: <span id="val-contraste">1.0</span>x</label>
                <input type="range" id="range-contraste" min="0.5" max="3.0" step="0.1" value="1.0">
            </div>
            <div class="control-group">
                <label for="range-umbral">Umbral: <span id="val-umbral">128</span></label>
                <input type="range" id="range-umbral" min="50" max="250" value="128">
            </div>
            <div class="control-group">
                <label for="range-densidad">Densidad: <span id="val-densidad">15</span>%</label>
                <input type="range" id="range-densidad" min="5" max="50" value="15">
            </div>
        </section>

        <main class="canvas-viewport" id="canvas-viewport">
            <div class="canvas-wrapper" id="canvas-wrapper">
                <canvas id="image-canvas"></canvas>
            </div>
        </main>

        <footer class="log-footer">
            <div id="log-console" class="log-console">
                <span class="log-info">[00:00:00] Sistema inicializado en modo 100% local.</span>
            </div>
        </footer>
    </div>

    <input type="file" id="file-input" accept="image/*" style="display: none;">
    <input type="file" id="excel-input" accept=".xlsx, .xls, .csv" style="display: none;">

    <script src="js/app.js"></script>
</body>
</html>
