<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0891b2">
  <title>MAR Caribe — Lectura de Tablas</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header>
  <h1>🏝️ MAR Caribe</h1>
  <p class="subtitulo">Lectura y Conversión de Tablas desde Imagen</p>
</header>

<main class="contenedor">
  <!-- ===== PÁGINA 1: SELECCIONAR IMAGEN ===== -->
  <section id="pagina-imagen" class="pagina activa">
    <div class="tarjeta">
      <h2>📸 Paso 1: Seleccionar Imagen</h2>
      <p style="color:#64748b; margin-bottom:16px;">
        Selecciona la imagen que recibiste por WhatsApp o de cualquier origen
      </p>
      
      <input type="file" id="input-archivo" accept="image/*" style="display:none;">
      
      <button id="btn-elegir-imagen" class="boton boton-primario">
        📁 Elegir Imagen del Dispositivo
      </button>
      
      <button id="btn-tomar-foto" class="boton boton-secundario">
        📷 Tomar Foto con Cámara
      </button>

      <!-- Vista previa -->
      <div id="vista-previa" class="oculto" style="margin-top:16px; text-align:center;">
        <img id="imagen-preview" style="max-width:100%; border-radius:12px;">
      </div>

      <button id="btn-procesar-imagen" class="boton boton-exito oculto" style="margin-top:16px;">
        🔍 2. Reconocer y Convertir en Tabla
      </button>
    </div>
    <div id="mensaje-imagen" class="estado"></div>
  </section>

  <!-- ===== PÁGINA 2: TEXTO ===== -->
  <section id="pagina-texto" class="pagina">
    <div class="tarjeta">
      <h2>📝 Paso 2: Texto Extraído</h2>
      <p style="color:#64748b; margin-bottom:16px;">Revisa el texto antes de convertir</p>
      
      <div id="barra-progreso" class="barra-progreso oculto">
        <div id="progreso" class="progreso"></div>
      </div>

      <textarea id="area-texto" rows="12" style="width:100%; padding:12px; border:1px solid #e2e8f0; border-radius:10px; font-size:14px;" placeholder="El texto aparecerá aquí..."></textarea>
      
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button id="btn-a-tabla" class="boton boton-primario" style="flex:1;">📊 3. Convertir a Tabla</button>
        <button id="btn-volver-imagen" class="boton boton-outline" style="flex:1;">⬅️ Cambiar Imagen</button>
      </div>
    </div>
    <div id="mensaje-texto" class="estado"></div>
  </section>

  <!-- ===== PÁGINA 3: TABLA ===== -->
  <section id="pagina-tabla" class="pagina">
    <div class="tarjeta">
      <h2>📋 Paso 3: Tabla Generada</h2>
      <p style="color:#64748b; margin-bottom:16px;">Datos organizados — copia o comparte</p>
      
      <div style="overflow-x:auto;">
        <table class="tabla" id="tabla-datos">
          <thead id="tabla-cabeza"></thead>
          <tbody id="tabla-cuerpo"></tbody>
        </table>
      </div>

      <div style="display:flex; gap:10px; margin-top:20px;">
        <button id="btn-copiar" class="boton boton-exito" style="flex:1;">📋 Copiar Tabla</button>
        <button id="btn-whatsapp" class="boton boton-secundario" style="flex:1;">💬 Enviar WhatsApp</button>
      </div>

      <button id="btn-nuevo" class="boton boton-outline" style="margin-top:12px; width:100%;">🔄 Nueva Imagen</button>
    </div>
    <div id="mensaje-tabla" class="estado"></div>
  </section>
</main>

<!-- NAVEGACIÓN INFERIOR -->
<nav>
  <button data-pagina="imagen" class="activo">
    <span>📷</span><br>Imagen
  </button>
  <button data-pagina="texto">
    <span>📝</span><br>Texto
  </button>
  <button data-pagina="tabla">
    <span>📊</span><br>Tabla
  </button>
</nav>

<!-- ✅ SCRIPT AL FINAL DEL HTML → SE CARGA DESPUÉS DE TODO -->
<script src="js/app.js"></script>
</body>
</html>
