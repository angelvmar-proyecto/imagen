<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>MAR Caribe — Tablas v9.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #f1f5f9; padding: 8px; max-width: 100vw; overflow-x: hidden; }
    h1 { font-size: 1rem; text-align: center; margin-bottom: 4px; color: #38bdf8; }
    .subtitulo { font-size: 0.7rem; color: #94a3b8; text-align: center; margin-bottom: 8px; }
    .botonera { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
    button { padding: 10px 4px; border: none; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; min-height: 44px; }
    .btn-img { background: #a855f7; color: white; }
    .btn-analizar { background: #22c55e; color: white; }
    .btn-menos { background: #3b82f6; color: white; }
    .btn-mas { background: #3b82f6; color: white; }
    .btn-ocr { background: #f97316; color: white; }
    .btn-limpiar { background: #ef4444; color: white; }
    .area-img { width: 100%; height: 45vh; background: #1e293b; border-radius: 10px; overflow: auto; display: flex; align-items: flex-start; justify-content: center; margin-bottom: 8px; }
    canvas { max-width: none; transform-origin: top left; display: block; }
    .logs { background: #1e293b; border-radius: 8px; padding: 8px; height: 20vh; overflow-y: auto; font-family: monospace; font-size: 0.7rem; line-height: 1.4; }
    #entradaImagen { display: none; }
    .progreso { width: 100%; height: 24px; background: #334155; border-radius: 12px; margin: 8px 0; overflow: hidden; }
    .barra-progreso { height: 100%; background: #22c55e; width: 0%; transition: width 0.3s; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; }
    .pasos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    .paso { padding: 10px 6px; background: #1e293b; border-radius: 8px; text-align: center; border: 2px solid transparent; }
    .paso.hecho { background: #166534; border-color: #22c55e; }
    .paso.pendiente { opacity: 0.6; }
    .paso-texto { font-size: 0.75rem; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>📊 MAR Caribe — Tablas v9.0</h1>
  <p class="subtitulo">1.Mediana → 2.Canales → 3.Óptica → 4.Ecografía → 5.Espectro → 6.LIDAR → 7.Editar → 8.Recortar → 9.OCR</p>

  <div class="progreso">
    <div class="barra-progreso" id="barraProgreso">0%</div>
  </div>

  <div class="pasos" id="pasosProceso">
    <div class="paso" id="paso1"><span>🧹</span><div class="paso-texto">1.Mediana</div></div>
    <div class="paso" id="paso2"><span>🎨</span><div class="paso-texto">2.Canales</div></div>
    <div class="paso" id="paso3"><span>🔭</span><div class="paso-texto">3.Óptica</div></div>
    <div class="paso" id="paso4"><span>🔊</span><div class="paso-texto">4.Ecografía</div></div>
    <div class="paso" id="paso5"><span>📡</span><div class="paso-texto">5.Espectro</div></div>
    <div class="paso" id="paso6"><span>📐</span><div class="paso-texto">6.LIDAR</div></div>
    <div class="paso" id="paso7"><span>✏️</span><div class="paso-texto">7.Editar</div></div>
    <div class="paso" id="paso8"><span>✂️</span><div class="paso-texto">8.Recortar</div></div>
    <div class="paso" id="paso9"><span>📄</span><div class="paso-texto">9.OCR</div></div>
  </div>

  <div class="botonera">
    <button class="btn-img" id="btnCargar">📷 Imagen</button>
    <button class="btn-analizar" id="btnAnalizar">🔬 Analizar</button>
    <button class="btn-menos" id="btnMenos">− Zoom</button>
    <button class="btn-mas" id="btnMas">+ Zoom</button>
    <button class="btn-ocr" id="btnOCR">📖 Leer</button>
    <button class="btn-limpiar" id="btnLimpiar">🗑️ Limpiar</button>
  </div>

  <input type="file" id="entradaImagen" accept="image/*">
  <div class="area-img"><canvas id="lienzo"></canvas></div>
  <div class="logs" id="logs"></div>

  <script src="tesseract/tesseract.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
