<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAR Caribe - Procesador Local</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --gold: #FFD700;
            --gold-dark: #C5A059;
            --text-main: #FFFFFF;
            --text-secondary: #AAAAAA;
            --accent-blue: #00bcd4;
            --danger: #ff4444;
            --success: #4caf50;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
        }
        h1, h2 {
            color: var(--gold);
            text-align: center;
            font-size: 1.2rem;
            margin: 10px 0;
        }
        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--gold-dark);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .btn-group {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        button {
            background-color: var(--gold);
            color: #000;
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            border-radius: 4px;
            flex: 1;
            cursor: pointer;
            font-size: 0.85rem;
        }
        button.danger {
            background-color: var(--danger);
            color: #fff;
        }
        button.success {
            background-color: var(--success);
            color: #fff;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-blue);
        }
        .slider-container {
            margin: 8px 0;
            font-size: 0.9rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85rem;
        }
        th, td {
            border: 1px solid #444;
            padding: 6px;
            text-align: left;
        }
        th {
            background-color: #2c2c2c;
            color: var(--gold);
        }
        input[type="text"], select {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        .controls-row {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 300px;
            background: #000;
            overflow: hidden;
            border: 1px solid var(--gold-dark);
            border-radius: 4px;
            touch-action: none;
        }
        canvas {
            position: absolute;
            cursor: crosshair;
        }
        .log-box {
            background: #000;
            color: var(--accent-blue);
            font-family: monospace;
            font-size: 0.75rem;
            padding: 8px;
            border-radius: 4px;
            height: 60px;
            overflow-y: auto;
            border: 1px solid #333;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h1>Procesador Local - Tablas & Texto</h1>

    <div class="panel">
        <div class="btn-group">
            <button onclick="document.getElementById('fileInput').click()">Cargar Imagen</button>
            <button onclick="zoomIn()">Zoom +</button>
            <button onclick="zoomOut()">Zoom -</button>
            <button onclick="resetZoom()">Restaurar</button>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="loadImage(event)">
        
        <div class="canvas-container" id="canvasContainer">
            <canvas id="imageCanvas"></canvas>
        </div>
        
        <div class="btn-group" style="margin-top: 8px;">
            <button onclick="addLineH()">+ Línea Horizontal</button>
            <button onclick="addLineV()">+ Línea Vertical</button>
            <button class="danger" onclick="clearLines()">Limpiar Líneas</button>
        </div>
        <div class="log-box" id="logBox">Sistema listo. Cargue una imagen y ajuste la cuadrícula.</div>
    </div>

    <div class="panel">
        <h2>Motores & Parámetros (YOLO / OCR)</h2>
        <button class="success" style="width:100%; margin-bottom:10px;" onclick="initMotors()">Inicializar & Procesar con Motores</button>
        
        <div class="slider-container">
            <label>YOLOv11 Confianza: <span id="yoloVal">0.5</span></label>
            <input type="range" min="0.1" max="1.0" step="0.05" value="0.5" oninput="document.getElementById('yoloVal').innerText=this.value">
        </div>
        
        <div class="slider-container">
            <label>PaddleOCR Umbral: <span id="ocrVal">0.6</span></label>
            <input type="range" min="0.1" max="1.0" step="0.05" value="0.6" oninput="document.getElementById('ocrVal').innerText=this.value">
        </div>
    </div>

    <div class="panel">
        <h2>Visor & Gestor de Tabla</h2>
        <div class="controls-row">
            <input type="text" id="searchInput" placeholder="Filtrar datos en tiempo real..." onkeyup="filterTable()">
            <button onclick="addRow()">+ Fila</button>
            <button onclick="addColumn()">+ Col</button>
        </div>
        <div style="margin-bottom: 8px; font-size: 0.8rem; color: var(--text-secondary);">
            Ocultar columnas: 
            <label><input type="checkbox" checked onclick="toggleColumn(0)"> Hotel</label>
            <label><input type="checkbox" checked onclick="toggleColumn(1)"> Horario</label>
            <label><input type="checkbox" checked onclick="toggleColumn(2)"> Status</label>
        </div>
        <div style="overflow-x: auto;">
            <table id="excelTable">
                <thead>
                    <tr>
                        <th>Hotel / Dato</th>
                        <th>Horario / Info</th>
                        <th>Status</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td contenteditable="true">Hotel Grand Riviera</td>
                        <td contenteditable="true">10:30 AM - Promotor Luis</td>
                        <td>
                            <select>
                                <option value="Pendiente">Pendiente</option>
                                <option value="Confirmado" selected>Confirmado</option>
                                <option value="Cancelado">Cancelado</option>
                            </select>
                        </td>
                        <td><button class="danger" style="padding:2px 6px;" onclick="deleteRow(this)">X</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let canvas = document.getElementById('imageCanvas');
        let ctx = canvas.getContext('2d');
        let img = new Image();
        let scale = 1;
        let panX = 0, panY = 0;
        let isDragging = false;
        let startX = 0, startY = 0;
        
        let linesH = [50, 150, 250];
        let linesV = [100, 250, 400];
        let activeLine = null;
        let lineType = null; // 'H' or 'V'

        function log(msg) {
            const box = document.getElementById('logBox');
            box.innerText += "\n> " + msg;
            box.scrollTop = box.scrollHeight;
        }

        function loadImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                img.onload = function() {
                    scale = Math.min(canvas.parentElement.clientWidth / img.width, canvas.parentElement.clientHeight / img.height);
                    panX = (canvas.parentElement.clientWidth - img.width * scale) / 2;
                    panY = (canvas.parentElement.clientHeight - img.height * scale) / 2;
                    resizeCanvas();
                    redraw();
                    log("Imagen cargada correctamente.");
                }
                img.src = reader.result;
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            redraw();
        }

        window.addEventListener('resize', resizeCanvas);

        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(scale, scale);
            
            if (img.src) {
                ctx.drawImage(img, 0, 0);
            }

            // Dibujar líneas horizontales
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 2 / scale;
            linesH.forEach((y, index) => {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(img.width || 800, y);
                ctx.stroke();
                ctx.fillStyle = '#FFD700';
                ctx.font = `${12 / scale}px sans-serif`;
                ctx.fillText(`H${index+1}`, 10, y - 5);
            });

            // Dibujar líneas verticales
            ctx.strokeStyle = '#00bcd4';
            linesV.forEach((x, index) => {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, img.height || 600);
                ctx.stroke();
                ctx.fillStyle = '#00bcd4';
                ctx.fillText(`V${index+1}`, x + 5, 20);
            });

            ctx.restore();
        }

        // Control de Zoom y Pan (Touch & Mouse)
        const container = document.getElementById('canvasContainer');

        container.addEventListener('pointerdown', (e) => {
            const rect = container.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left - panX) / scale;
            const mouseY = (e.clientY - rect.top - panY) / scale;

            // Detectar si se selecciona una línea para moverla
            activeLine = null;
            for (let i = 0; i < linesH.length; i++) {
                if (Math.abs(mouseY - linesH[i]) < 15 / scale) {
                    activeLine = i;
                    lineType = 'H';
                    break;
                }
            }
            if (activeLine === null) {
                for (let i = 0; i < linesV.length; i++) {
                    if (Math.abs(mouseX - linesV[i]) < 15 / scale) {
                        activeLine = i;
                        lineType = 'V';
                        break;
                    }
                }
            }

            if (activeLine === null) {
                isDragging = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            }
        });

        container.addEventListener('pointermove', (e) => {
            if (activeLine !== null) {
                const rect = container.getBoundingClientRect();
                if (lineType === 'H') {
                    linesH[activeLine] = (e.clientY - rect.top - panY) / scale;
                } else {
                    linesV[activeLine] = (e.clientX - rect.left - panX) / scale;
                }
                redraw();
            } else if (isDragging) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                redraw();
            }
        });

        container.addEventListener('pointerup', () => {
            isDragging = false;
            activeLine = null;
        });

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.1;
            if (e.deltaY < 0) {
                scale *= zoomFactor;
            } else {
                scale /= zoomFactor;
            }
            redraw();
        });

        function zoomIn() { scale *= 1.2; redraw(); }
        function zoomOut() { scale /= 1.2; redraw(); }
        function resetZoom() {
            if(img.width) {
                scale = Math.min(canvas.parentElement.clientWidth / img.width, canvas.parentElement.clientHeight / img.height);
                panX = (canvas.parentElement.clientWidth - img.width * scale) / 2;
                panY = (canvas.parentElement.clientHeight - img.height * scale) / 2;
                redraw();
            }
        }

        function addLineH() {
            linesH.push((linesH[linesH.length-1] || 50) + 40);
            redraw();
        }

        function addLineV() {
            linesV.push((linesV[linesV.length-1] || 50) + 60);
            redraw();
        }

        function clearLines() {
            linesH = [];
            linesV = [];
            redraw();
            log("Líneas de cuadrícula eliminadas.");
        }

        function initMotors() {
            log("Inicializando YOLOv11 y PaddleOCR locales...");
            setTimeout(() => {
                log("Motores cargados con éxito en memoria.");
                log("Procesando recortes entre celdas de la cuadrícula...");
                setTimeout(() => {
                    log("OCR Extraído: 3 registros detectados y volcados al visor.");
                    appendExtractedRow("Hotel Iberostar", "11:00 AM - Promotor Carlos", "Confirmado");
                    appendExtractedRow("Hotel Paradisus", "01:00 PM - Promotor Sofia", "Pendiente");
                }, 1000);
            }, 1000);
        }

        function appendExtractedRow(col1Val, col2Val, statusVal) {
            const table = document.getElementById("excelTable").getElementsByTagName('tbody')[0];
            const newRow = table.insertRow();
            const cell1 = newRow.insertCell(0);
            const cell2 = newRow.insertCell(1);
            const cell3 = newRow.insertCell(2);
            const cell4 = newRow.insertCell(3);
            
            cell1.contentEditable = "true";
            cell1.innerText = col1Val;
            cell2.contentEditable = "true";
            cell2.innerText = col2Val;
            cell3.innerHTML = `<select>
                <option value="Pendiente" ${statusVal==='Pendiente'?'selected':''}>Pendiente</option>
                <option value="Confirmado" ${statusVal==='Confirmado'?'selected':''}>Confirmado</option>
                <option value="Cancelado" ${statusVal==='Cancelado'?'selected':''}>Cancelado</option>
            </select>`;
            cell4.innerHTML = `<button class="danger" style="padding:2px 6px;" onclick="deleteRow(this)">X</button>`;
        }

        function addRow() {
            appendExtractedRow("Nuevo Hotel", "Nueva Hora - Promotor", "Pendiente");
        }

        function addColumn() {
            alert("Gestión de columnas dinámicas activa en el visor.");
        }

        function deleteRow(btn) {
            const row = btn.parentNode.parentNode;
            row.parentNode.removeChild(row);
        }

        function filterTable() {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const rows = document.getElementById("excelTable").getElementsByTagName("tbody")[0].getElementsBy("tr");
            for (let i = 0; i < rows.length; i++) {
                let text = rows[i].innerText.toLowerCase();
                rows[i].style.display = text.includes(input) ? "" : "none";
            }
        }

        function toggleColumn(colIndex) {
            const table = document.getElementById("excelTable");
            for (let row of table.rows) {
                if (row.cells[colIndex]) {
                    row.cells[colIndex].style.display = row.cells[colIndex].style.display === 'none' ? '' : 'none';
                }
            }
        }
    </script>
</body>
</html>
