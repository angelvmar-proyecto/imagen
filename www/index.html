<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAR Caribe – Mini Excel Pro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1 class="app-title">MAR Caribe – Mini Excel</h1>
            <label class="btn-primary" id="btn-cargar">
                📁 Cargar Imagen
                <input type="file" id="file-input" accept="image/*" hidden>
            </label>
        </header>

        <div class="toolbar-grid">
            <button class="btn-tool" id="btn-bloquear">🔒 Bloquear</button>
            <button class="btn-tool" id="btn-reset">🔄 Reset L</button>
            <button class="btn-tool" id="btn-h" title="Dibujar Línea Horizontal Manual">➕ L.H.</button>
            <button class="btn-tool" id="btn-v" title="Dibujar Línea Vertical Manual">➕ L.V.</button>
        </div>

        <div class="slider-container">
            <span class="slider-label">Umbral Dinámico (LiDAR):</span>
            <input type="range" id="umbral-slider" min="0" max="100" value="50">
            <span id="umbral-val">50</span>
        </div>

        <div class="zoom-toolbar">
            <button class="btn-zoom" id="zoom-out">🔍 -</button>
            <button class="btn-zoom" id="zoom-reset">1:1</button>
            <button class="btn-zoom" id="zoom-in">🔍 +</button>
        </div>

        <div class="engines-bar">
            <span class="engines-label">MOTOR:</span>
            <button class="engine-tab active" data-engine="tesseract">Tesseract</button>
            <button class="engine-tab" data-engine="paddle">Paddle.js</button>
            <button class="engine-tab" data-engine="mlkit">ML Kit</button>
        </div>

        <div class="canvas-viewport" id="viewport">
            <div class="canvas-scaler" id="canvas-scaler">
                <canvas id="processing-canvas"></canvas>
            </div>
            <div class="processing-overlay" id="loading-overlay" style="display: none;">
                <div class="spinner"></div>
                <span class="loading-title" id="loading-status-title">Procesando OCR...</span>
                <span id="progress-text">0%</span>
            </div>
        </div>

        <div class="excel-footer-panel">
            <div class="excel-status" id="excel-status">Mini Excel - Esperando imagen...</div>
            <div class="excel-actions">
                <button class="btn-table" id="btn-add-fila">➕ Fila</button>
                <button class="btn-table" id="btn-add-col">➕ Col</button>
                <button class="btn-table btn-danger" id="btn-vaciar">🗑️ Vaciar</button>
                <button class="btn-table btn-success" id="btn-exportar">📤 Exportar CSV</button>
            </div>
        </div>

        <div class="cell-inspector">
            <span class="cell-tag" id="active-cell-label">A1</span>
            <input type="text" id="cell-value-input" value="Selecciona o procesa una imagen..." readonly>
            <button class="btn-search-cell" id="btn-search">🔍 Log CSV</button>
        </div>

        <div class="mini-excel-grid-container">
            <table id="mini-excel-table">
                <tbody id="excel-tbody">
                    <tr><td id="cell-A1">A1: [Vacío]</td><td id="cell-B1">B1: [Vacío]</td></tr>
                    <tr><td id="cell-A2">A2: [Vacío]</td><td id="cell-B2">B2: [Vacío]</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
