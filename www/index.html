<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAR Caribe — Leer Tablas</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<h1>🏝️ MAR Caribe</h1>
<p>Imagen → Texto → Tabla</p>

<!-- SELECCIONAR IMAGEN -->
<input type="file" id="archivo" accept="image/*">
<button id="btnSeleccionar">📁 Elegir Imagen</button>

<!-- VISTA DE TU IMAGEN -->
<div id="vista" style="display:none; margin:15px 0;">
  <img id="foto" alt="Tu imagen">
  <button id="btnLeer">🔍 Leer Texto</button>
</div>

<!-- TEXTO LEÍDO -->
<div id="cajaTexto" style="display:none; margin:15px 0;">
  <h3>Texto extraído:</h3>
  <textarea id="texto" rows="8"></textarea>
  <button id="btnTabla">📊 Hacer Tabla</button>
</div>

<!-- TABLA FINAL -->
<div id="cajaTabla" style="display:none; margin:15px 0;">
  <h3>Tu tabla:</h3>
  <div id="tabla"></div>
  <button id="btnCopiar">📋 Copiar</button>
  <button id="btnWA">💬 WhatsApp</button>
  <button id="btnNuevo">🔄 Otra imagen</button>
</div>

<script src="js/app.js"></script>
</body>
</html>
