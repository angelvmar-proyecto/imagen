<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>OCR Timeshare</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 12px; background: #1a1a1a; margin: 0; color: #f1f5f9;
    }
    h1 { font-size: 20px; margin: 8px 0 12px 0; color: #38bdf8; }
    button {
      padding: 14px 20px; font-size: 16px; margin: 5px 0; width: 100%;
      border: none; border-radius: 8px; cursor: pointer; font-weight: 600;
    }
    #btnCamara { background: #3b82f6; color: white; }
    #btnGaleria { background: #8b5cf6; color: white; }
    #btnLimpiarCache { background: #dc2626; color: white; font-size: 12px; padding: 8px; }
    #estado { color: #94a3b8; margin-top: 10px; font-size: 14px; min-height: 18px; }

    #barraContenedor {
      width: 100%; height: 24px; background: #334155;
      border-radius: 12px; overflow: hidden; margin-top: 15px; display: none;
    }
    #barraProgreso {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      border-radius: 12px; transition: width 0.3s ease;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 12px; font-weight: bold;
    }

    /* Animación CSS: corre en el compositor aunque JS esté bloqueado */
    @keyframes progresoOCR {
      from { width: 60%; }
      to { width: 95%; }
    }
    #barraProgreso.animando {
      animation: progresoOCR 300s linear forwards;
    }

    #barraTexto { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 5px; min-height: 16px; }

    #avisoResultado {
      margin-top: 10px; padding: 8px 12px; background: #164e63;
      border-left: 4px solid #06b6d4; border-radius: 4px;
      font-size: 12px; color: #67e8f9; display: none;
    }

    /* Barra de zoom */
    #barraZoom {
      display: none; margin-top: 12px; padding: 6px 8px;
      background: #1e293b; border-radius: 8px;
      align-items: center; gap: 8px;
      border: 1px solid #334155;
    }
    #barraZoom.visible { display: flex; }
    #barraZoom button {
      padding: 6px 12px; font-size: 14px; width: auto;
      margin: 0; background: #334155; color: #f1f5f9;
      border-radius: 6px;
    }
    #barraZoom button:active { background: #475569; }
    #zoomNivel {
      font-size: 12px; color: #94a3b8;
      min-width: 45px; text-align: center; font-weight: 600;
    }
    #zoomInfo { margin-left: auto; font-size: 10px; color: #64748b; }

    /* Mini Excel */
    #tablaContenedor {
      margin-top: 8px; overflow: auto;
      border: 2px solid #38bdf8; border-radius: 6px;
      max-height: 65vh; display: none;
      background: #0f172a;
      box-shadow: 0 2px 12px rgba(56,189,248,0.2);
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y pinch-zoom;
    }
    #tablaResultado {
      border-collapse: collapse; font-size: 14px;
      font-family: 'Roboto Mono', 'Courier New', monospace;
      table-layout: auto;
      transform-origin: top left;
      will-change: transform;
    }
    #tablaResultado th,
    #tablaResultado td {
      border: 1px solid #334155; padding: 5px 7px;
      vertical-align: top; white-space: nowrap;
      text-overflow: ellipsis; overflow: hidden;
      max-width: 250px; line-height: 1.4; min-width: 60px;
    }
    #tablaResultado td:not(:empty) {
      background: #ffffff; color: #000000; font-weight: 600;
    }
    #tablaResultado td:empty {
      background: repeating-linear-gradient(
        45deg, #1e293b, #1e293b 4px, #0f172a 4px, #0f172a 8px
      );
    }
    #tablaResultado td.col-num {
      background: #fbbf24; color: #000000; text-align: center;
      width: 36px; min-width: 36px; font-weight: 700;
      position: sticky; left: 0; z-index: 2;
      border-right: 2px solid #f59e0b;
      font-size: 15px;
    }
    #tablaResultado tr:nth-child(even) td:not(:empty) { background: #f1f5f9; }
    #tablaResultado tr:nth-child(even) td.col-num { background: #f59e0b; }
    #tablaResultado td:focus { outline: 2px solid #38bdf8; background: #dbeafe !important; }

    #debug {
      white-space: pre-wrap; background: #450a0a; padding: 10px;
      margin-top: 10px; font-size: 10px; color: #fca5a5;
      max-height: 30vh; overflow: auto; display: none;
      border-radius: 6px; font-family: monospace; border: 1px solid #dc2626;
    }
    #resultado {
      white-space: pre-wrap; background: #1e293b; padding: 10px;
      margin-top: 10px; font-size: 11px; max-height: 40vh;
      overflow: auto; display: none; border-radius: 6px;
      font-family: monospace; color: #cbd5e1;
    }
  </style>
</head>
<body>
  <h1>OCR Timeshare</h1>
  <button id="btnCamara">📷 Tomar Foto</button>
  <button id="btnGaleria">🖼️ Elegir de Galería</button>
  <button id="btnLimpiarCache">🗑️ Borrar último resultado</button>
  <div id="estado">Cargando...</div>

  <div id="barraContenedor">
    <div id="barraProgreso">0%</div>
  </div>
  <div id="barraTexto"></div>

  <div id="avisoResultado">
    📋 Mostrando resultado anterior. Pulsa <b>Tomar Foto</b> o <b>Galería</b> para escanear de nuevo.
  </div>

  <div id="barraZoom">
    <button id="btnZoomMenos">➖ A-</button>
    <span id="zoomNivel">100%</span>
    <button id="btnZoomMas">➕ A+</button>
    <button id="btnZoomReset">🔄 Reset</button>
    <span id="zoomInfo">Pellizca con 2 dedos</span>
  </div>

  <div id="tablaContenedor">
    <table id="tablaResultado"><tbody></tbody></table>
  </div>

  <div id="resultado"></div>
  <div id="debug"></div>

  <script>
    window.addEventListener('error', (e) => {
      const dbg = document.getElementById('debug');
      if (dbg) { dbg.style.display = 'block'; dbg.textContent += `[ERROR] ${e.message} en ${e.filename}:${e.lineno}\n`; }
    });
    window.addEventListener('unhandledrejection', (e) => {
      const dbg = document.getElementById('debug');
      if (dbg) { dbg.style.display = 'block'; dbg.textContent += `[PROMESA] ${e.reason}\n`; }
    });
  </script>
<script src="lib/xlsx.full.min.js"></script>
  <script src="js/config-deteccion.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/preprocesamiento.js"></script>
  <script src="js/deteccion.js"></script>
  <script src="js/lidar.js"></script>
  <script src="js/retina.js"></script>
  <script src="js/cache.js"></script>
<script src="js/excel-lector.js"></script>  
<script type="module" src="/js/app.js"></script>
</body>
</html>
