<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Invitaciones - Celdas y OCR</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <header class="toolbar">
    <button id="btnToggleEdit" class="btn btn-primary" onclick="toggleMode()">Modo: LECTURA</button>
    <button class="btn btn-secondary" onclick="toggleHideColumn()">Ocultar Columna Status</button>
    <button class="btn btn-secondary" onclick="exportToExcel()">Exportar Excel</button>
    <button class="btn btn-danger" onclick="purgeDeleted()">Eliminar por Status</button>
  </header>

  <main class="table-container">
    <table id="dataTable">
      <thead>
        <tr>
          <th>ID</th>
          <th id="colStatus">Status (Solo Lectura)</th>
          <th>Nombre / Invitado</th>
          <th>Detalle / Folio</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
