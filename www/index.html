<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAR Caribe — Escáner de Tablas</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- SheetJS para lectura de Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Tesseract.js versión 4.1.1 para compatibilidad offline estable en móvil -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v4/dist/tesseract.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>MAR Caribe - Autoajuste & Aprendizaje</h1>
        
        <div class="card-upload">
            <label>1. Archivo Excel de Referencia (Opcional):</label>
            <input type="file" id="excelFile" accept=".xlsx, .xls">
            
            <label>2. Imagen de WhatsApp (Obligatoria):</label>
            <input type="file" id="imageFile" accept="image/*">
            
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button onclick="ejecutarCalibracionDual()" style="flex: 2; background: #00bcd4; color: #000; font-weight: bold;">Procesar con OCR</button>
                <button onclick="limpiarFormulario()" style="flex: 1; background: #d32f2f; color: #fff;">Limpiar</button>
            </div>
        </div>

        <div class="card-upload" style="background: #181818; border: 1px dashed #444; margin-top: 15px;">
            <label style="color: #00bcd4; font-weight: bold;">Visor y Gestión del Log de Aprendizaje:</label>
            <div style="display: flex; gap: 10px; margin: 10px 0;">
                <button onclick="mostrarLogEnPantalla()" style="flex: 1; background: #333;">Actualizar Vista</button>
                <button onclick="limpiarLogLocal()" style="flex: 1; background: #5a2a2a;">Borrar Log</button>
            </div>
            <textarea id="visorLog" readonly style="width: 100%; height: 120px; background: #111; color: #00ffcc; font-family: monospace; font-size: 11px; padding: 8px; border: 1px solid #333; border-radius: 4px;" placeholder="El contenido del log aparecerá aquí..."></textarea>
            
            <label style="margin-top: 10px; font-size: 11px;">Importar Log Previo (.json):</label>
            <input type="file" id="importLogFile" accept=".json" onchange="importarLogAprendizaje(event)">
        </div>

        <div id="results-section" style="margin-top: 20px;">
            <h3>Resultados de Extracción</h3>
            <div style="overflow-x: auto;">
                <table id="tabla-resultados" border="1" style="width:100%; border-collapse: collapse; color: #fff;">
                    <thead>
                        <tr style="background: #333;">
                            <th>Esperando datos...</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Dinámico -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function mostrarLogEnPantalla() {
            const logGuardado = localStorage.getItem('mar_caribe_learning_log') || '[]';
            try {
                const parsed = JSON.parse(logGuardado);
                document.getElementById('visorLog').value = JSON.stringify(parsed, null, 2);
            } catch(e) {
                document.getElementById('visorLog').value = logGuardado;
            }
        }
        
        function limpiarLogLocal() {
            if(confirm("¿Estás seguro de vaciar el historial de aprendizaje?")) {
                localStorage.removeItem('mar_caribe_learning_log');
                mostrarLogEnPantalla();
                alert("Log eliminado.");
            }
        }

        function limpiarFormulario() {
            document.getElementById('excelFile').value = '';
            document.getElementById('imageFile').value = '';
            document.getElementById('tabla-resultados').querySelector('thead').innerHTML = '<tr style="background: #333;"><th>Esperando datos...</th></tr>';
            document.getElementById('tabla-resultados').querySelector('tbody').innerHTML = '';
            alert("Campos limpiados correctamente. Listo para una nueva prueba.");
        }

        window.onload = function() {
            mostrarLogEnPantalla();
        };
    </script>
</body>
</html>
