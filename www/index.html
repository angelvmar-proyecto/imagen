<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>OCR Escáner de Tablas</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
</head>
<body>
  <div class="header">
    <h1>Escáner de Tablas (LFM & Low-Pass)</h1>
    <p id="statusText">Listo para cargar imagen...</p>
  </div>

  <div class="controls">
    <button onclick="capturarImagen()">📷 Capturar / Cargar</button>
    <button onclick="autoAlinearHibrida()">📐 Auto-Alinear Rejilla</button>
    <button onclick="resetRejilla()">🔄 Reset Rejilla</button>
    <button class="btn-main" onclick="ejecutarEscaneoConFiltros()">⚡ Escaneo con Filtros</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="cargarDesdeInput(event)">
  </div>

  <div class="controls" style="margin-top: -4px;">
    <label style="font-size: 0.8rem; display: flex; align-items: center; gap: 6px; color: #f59e0b; cursor: pointer;">
      <input type="checkbox" id="lowPassToggle" style="accent-color: #d97706;"> Low-Pass Filter (Denoiser)
    </label>
    <select id="engineSelect" style="background: #27272a; color: #fff; border: 1px solid #3f3f46; padding: 6px; border-radius: 6px; font-size: 0.8rem;">
      <option value="tesseract">Tesseract OCR</option>
      <option value="lfm">LFM 2.5-VL (450M)</option>
    </select>
  </div>

  <div class="canvas-container">
    <img id="imgPreview" alt="Vista previa" onload="inicializarRejilla()">
    <canvas id="gridCanvas"></canvas>
  </div>

  <div class="progress-container" id="progressWrapper" style="display:none;">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-info">
      <span id="progressStep">Procesando...</span>
      <span id="progressPercent">0%</span>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Buscar en resultados..." oninput="filtrarMatriz()">
    <button onclick="copiarAlPortapapeles()">📋 Copiar TSV</button>
    <button onclick="limpiarTabla()">🗑️ Limpiar</button>
    <span id="rowCount">0 filas</span>
  </div>

  <div class="table-container" id="tableWrapper">
    <div class="empty-state">Carga una imagen, configura los filtros y presiona "Escaneo con Filtros".</div>
  </div>

  <script src="js/opencv.js" async></script>
  <script src="js/app.js"></script>
</body>
</html>
