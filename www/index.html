<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAR Caribe — 3 Motores IA</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header>
  <h1>🏝️ MAR Caribe</h1>
  <p>Imagen → Tabla — 3 Motores IA Independientes</p>
</header>
<main>
  <!-- CARGA GLOBAL DE TF.js Y TFLite -->
  <div id="cargaGlobal">
    <h3>Cargando motores base...</h3>
    <div class="barra"><div id="barraGlobal"></div></div>
    <p id="estadoTF">⏳ TF.js: Cargando...</p>
    <p id="estadoTFLite">⏳ TFLite: Cargando...</p>
    <div id="logsGlobal"></div>
  </div>

  <!-- SELECCIÓN DE IMAGEN -->
  <div id="seccionImagen" class="oculto">
    <button id="btnSeleccionar">📁 Elegir Imagen</button>
    <input type="file" id="entradaImagen" accept="image/*" class="oculto">
    <div id="vistaImagen" class="oculto">
      <img id="imagenPreview" alt="Imagen de tabla">
    </div>
  </div>

  <!-- MOTOR 1: SSD MobileNet v2 -->
  <section class="motor" id="motor1">
    <h3>🔍 Motor 1: SSD MobileNet v2</h3>
    <div class="estado">Estado: <span id="estadoM1">⏳ Pendiente</span></div>
    <div class="barra"><div id="barraM1"></div></div>
    <div class="botonesMotor">
      <button id="btnAnalizarM1">🔍 Analizar</button>
      <button id="btnResetM1" class="btnReset">🔄 Reset</button>
    </div>
    <div id="resultadoM1" class="resultado"></div>
    <div id="logsM1" class="logs"></div>
  </section>

  <!-- MOTOR 2: EfficientDet-Lite0 -->
  <section class="motor" id="motor2">
    <h3>⚡ Motor 2: EfficientDet-Lite0</h3>
    <div class="estado">Estado: <span id="estadoM2">⏳ Pendiente</span></div>
    <div class="barra"><div id="barraM2"></div></div>
    <div class="botonesMotor">
      <button id="btnAnalizarM2">⚡ Analizar</button>
      <button id="btnResetM2" class="btnReset">🔄 Reset</button>
    </div>
    <div id="resultadoM2" class="resultado"></div>
    <div id="logsM2" class="logs"></div>
  </section>

  <!-- MOTOR 3: YOLOv8n -->
  <section class="motor" id="motor3">
    <h3>🎯 Motor 3: YOLOv8n</h3>
    <div class="estado">Estado: <span id="estadoM3">⏳ Pendiente</span></div>
    <div class="barra"><div id="barraM3"></div></div>
    <div class="botonesMotor">
      <button id="btnAnalizarM3">🎯 Analizar</button>
      <button id="btnResetM3" class="btnReset">🔄 Reset</button>
    </div>
    <div id="resultadoM3" class="resultado"></div>
    <div id="logsM3" class="logs"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.10/dist/tf-tflite.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
