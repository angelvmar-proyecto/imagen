<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAR Caribe — Leer Tablas REALES</title>
  <link rel="stylesheet" href="css/estilos.css">
  <!-- OCR REAL — Tesseract.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

<header>
  <h1>🏝️ MAR Caribe</h1>
  <p>Imagen REAL → Lectura REAL → Tabla REAL</p>
</header>

<main>
  <!-- PASO 1: ELEGIR Y VER IMAGEN -->
  <div id="paso1">
    <h2>1. Selecciona tu imagen</h2>
    <p>Elige la imagen que recibiste por WhatsApp</p>
    
    <input type="file" id="selectorImagen" accept="image/*,.jpg,.jpeg,.png">
    <button id="btnElegir">📁 Elegir Imagen</button>
    
    <!-- AQUÍ SE VE TU IMAGEN REAL — NO SIMULACIÓN -->
    <div id="contenedorImagen" class="oculto">
      <h3>✅ Tu imagen:</h3>
      <img id="imagenSubida" alt="Tu imagen seleccionada">
      <button id="btnLeerAhora">🔍 Leer texto de ESTA imagen</button>
    </div>
  </div>

  <!-- PASO 2: LECTURA OCR REAL -->
  <div id="paso2" class="oculto">
    <h2>2. Texto leído de tu imagen</h2>
    <div id="barraCarga">
      <div id="progresoOCR"></div>
    </div>
    <textarea id="textoLeido" rows="12" readonly placeholder="El texto de tu imagen aparecerá aquí..."></textarea>
    <button id="btnCrearTabla">📊 Convertir en tabla</button>
    <button id="btnVolver">⬅️ Elegir otra imagen</button>
  </div>

  <!-- PASO 3: TABLA REAL -->
  <div id="paso3" class="oculto">
    <h2>3. Tabla generada de TU imagen</h2>
    <div id="contenedorTablaReal"></div>
    <button id="btnCopiarTodo">📋 Copiar tabla completa</button>
    <button id="btnEnviarWhatsApp">💬 Enviar por WhatsApp</button>
    <button id="btnEmpezarDeNuevo">🔄 Leer otra imagen</button>
  </div>

  <div id="avisos"></div>
</main>

<script src="js/app.js"></script>
</body>
</html>
