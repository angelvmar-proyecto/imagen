<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAR Caribe - OCR Studio</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
    <header>
        <h1>MAR Caribe — Procesador Limpio</h1>
    </header>
    <div class="main-container">
        <div class="panel">
            <div class="panel-title">1. Zona de Trabajo & Cuadrícula</div>
            <div class="canvas-box" id="canvasBox">
                <span class="placeholder" id="placeholderText">Toca para cargar imagen</span>
                <canvas id="workspaceCanvas"></canvas>
            </div>
            <input type="file" id="fileInput" accept="image/*" style="display:none">
            <div class="btn-group">
                <button class="btn-sec" id="loadBtn">📁 Cargar</button>
                <button class="btn-sec" id="lockBtn">🔒 Bloquear</button>
                <button class="btn-danger" id="resetBtn">Limpiar</button>
            </div>
        </div>
        <div class="panel">
            <div class="panel-title">2. Motores de Extracción</div>
            <div class="btn-group vertical">
                <button class="btn-engine tess" id="btnTess">⚡ Extraer con Tesseract.js</button>
                <button class="btn-engine ml" id="btnML">⚡ Extraer con Google ML Kit</button>
                <button class="btn-engine paddle" id="btnPaddle">⚡ Extraer con PaddleOCR / ONNX</button>
            </div>
            <div class="progress-container" id="progressContainer" style="display:none;">
                <div class="progress-bar" id="progressBar"></div>
                <div class="progress-text" id="progressText">0%</div>
            </div>
        </div>
        <div class="panel">
            <div class="panel-title">
                <span>3. Visor de Datos</span>
                <div>
                    <button class="btn-tiny" id="addRowBtn">+ Fila</button>
                    <button class="btn-tiny" id="addColBtn">+ Col</button>
                </div>
            </div>
            <input type="text" class="search-input" id="searchInput" placeholder="Filtrar registros...">
            <div class="table-container">
                <table id="resultTable">
                    <thead>
                        <tr id="tableHeaderRow">
                            <th>Columna 1</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td contenteditable="true">Dato de ejemplo</td>
                            <td><button class="btn-danger-sm" onclick="this.closest('tr').remove()">×</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="btn-group" style="margin-top: 8px;">
                <button class="btn-sec" id="exportBtn">📄 Exportar</button>
                <button class="btn-danger" id="clearTableBtn">Vaciar Tabla</button>
            </div>
        </div>
    </div>
    <canvas id="sourceCanvas" style="display:none;"></canvas>
    <script src="script.js"></script>
</body>
</html>
