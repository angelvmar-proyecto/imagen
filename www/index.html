<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>MAR Caribe — Tablas</title>
  <style>
    * {box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;}
    body{background:#0f172a;color:#f1f5f9;padding:8px;max-width:100vw;overflow-x:hidden;}
    h1{font-size:1rem;text-align:center;margin-bottom:6px;color:#38bdf8;}
    .botonera{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
    button{padding:12px 8px;border:none;border-radius:10px;font-size:0.9rem;font-weight:600;cursor:pointer;min-height:50px;}
    .btn-imagen{background:#a855f7;color:white;}
    .btn-analizar{background:#22c55e;color:white;}
    .btn-leer{background:#f59e0b;color:white;}
    .btn-menos,.btn-mas{background:#3b82f6;color:white;}
    .btn-vista{background:#6366f1;color:white;}
    .btn-limpiar{background:#ef4444;color:white;}
    .area-imagen{width:100%;height:50vh;background:#1e293b;border-radius:12px;overflow:auto;display:flex;align-items:flex-start;justify-content:center;margin-bottom:10px;}
    canvas{max-width:none;transform-origin:top left;display:block;}
    .logs{background:#1e293b;border-radius:10px;padding:10px;height:20vh;overflow-y:auto;font-family:monospace;font-size:0.75rem;line-height:1.5;margin-bottom:10px;}
    #entradaImagen{display:none;}
  </style>
</head>
<body>
  <h1>📊 MAR Caribe — Tablas</h1>
  <div class="botonera">
    <button class="btn-imagen" id="btnCargar">📷 Imagen</button>
    <button class="btn-analizar" id="btnAnalizar">🔬 Líneas</button>
    <button class="btn-leer" id="btnLeer">📖 Leer</button>
    <button class="btn-menos" id="btnMenosZoom">−</button>
    <button class="btn-mas" id="btnMasZoom">+</button>
    <button class="btn-vista" id="btnVista">🔄 Vista</button>
    <button class="btn-limpiar" id="btnLimpiar">🗑️ Limpiar</button>
  </div>
  <input type="file" id="entradaImagen" accept="image/*">
  <div class="area-imagen"><canvas id="lienzo"></canvas></div>
  <div class="logs" id="logs"></div>
  <div id="contenidoTabla"></div>

  <!-- ✅ 5 ARCHIVOS LOCALES — RUTAS CORRECTAS -->
  <script src="tessdata/tesseract.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
