<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAR Caribe – Procesador Limpio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="appContainer">
        <header>
            <h2>MAR Caribe — Procesador Limpio</h2>
        </header>

        <!-- 1. Zona de Trabajo & Cuadrícula -->
        <section class="card">
            <h3>1. Zona de Trabajo & Cuadrícula</h3>
            <div id="canvasBox" style="position:relative; width:100%; height:300px; background:#111; overflow:hidden; border:1px solid #444;">
                <canvas id="workspaceCanvas" style="display:block; width:100%; height:100%;"></canvas>
                <div id="placeholderText" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); color:#777; pointer-events:none; font-size:16px;">Toca para cargar imagen</div>
            </div>
            <canvas id="sourceCanvas" style="display:none;"></canvas>
            
            <div class="btn-group" style="margin-top:10px; display:flex; gap:8px;">
                <button id="loadBtn" class="btn btn-primary" style="font-size:16px; flex:1;">📁 Cargar</button>
                <button id="lockBtn" class="btn btn-warning" style="font-size:16px; flex:1;">🔒 Bloquear</button>
                <button id="resetBtn" class="btn btn-danger" style="font-size:16px; flex:1;">Limpiar</button>
            </div>
            <input type="file" id="fileInput" accept="image/*" style="display:none;">

            <!-- Contenedor para controles deslizantes (sliders) dinámicos -->
            <div id="slidersContainer" style="margin-top:15px; max-height:200px; overflow-y:auto; padding:5px; background:#181818; border-radius:4px;"></div>
        </section>

        <!-- 2. Motores de Extracción -->
        <section class="card">
            <h3>2. Motores de Extracción</h3>
            <button id="btnTess" class="btn btn-success" style="font-size:16px; width:100%; margin-bottom:8px;">⚡ Extraer con Tesseract.js</button>
            <button id="btnML" class="btn btn-info" style="font-size:16px; width:100%; margin-bottom:8px;">⚡ Extraer con Google ML Kit</button>
            <button id="btnPaddle" class="btn btn-warning" style="font-size:16px; width:100%;">⚡ Extraer con PaddleOCR / ONNX</button>
            
            <div id="progressContainer" style="display:none; margin-top:10px; background:#222; border-radius:4px; overflow:hidden;">
                <div id="progressBar" style="width:0%; height:20px; background:#4CAF50; text-align:center; font-size:12px; color:#fff;">0%</div>
                <div id="progressText" style="text-align:center; font-size:12px; color:#aaa; padding:2px;">Procesando...</div>
            </div>
        </section>

        <!-- 3. Visor de Datos -->
        <section class="card">
            <h3>3. Visor de Datos</h3>
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <button id="addRowBtn" class="btn btn-secondary" style="font-size:15px;">+ Fila</button>
                <button id="addColBtn" class="btn btn-secondary" style="font-size:15px;">+ Col</button>
            </div>
            <input type="text" id="searchInput" placeholder="Filtrar registros..." style="width:100%; padding:8px; margin-bottom:8px; background:#222; border:1px solid #444; color:#fff; font-size:15px; border-radius:4px;">
            
            <div style="max-height:250px; overflow:auto; border:1px solid #444;">
                <table id="dataTable" style="width:100%; border-collapse:collapse; color:#ddd; font-size:14px;">
                    <thead>
                        <tr id="tableHeaderRow" style="background:#222;">
                            <th style="padding:8px; border:1px solid #444;">Columna 1</th>
                            <th style="padding:8px; border:1px solid #444;">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td contenteditable="true" style="padding:6px; border:1px solid #444;">Dato de ejemplo</td>
                            <td style="padding:6px; border:1px solid #444; text-align:center;"><button class="btn-danger-sm" onclick="this.closest('tr').remove()">×</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div style="display:flex; gap:8px; margin-top:10px;">
                <button id="exportBtn" class="btn btn-primary" style="font-size:16px; flex:1;">📄 Exportar</button>
                <button id="exportParamsBtn" class="btn btn-info" style="font-size:16px; flex:1;" title="Exporta JSON con las coordenadas y líneas actuales">💾 Estándar</button>
                <button id="clearTableBtn" class="btn btn-danger" style="font-size:16px; flex:1;">Vaciar Tabla</button>
            </div>
        </section>
    </div>

    <!-- Tesseract local CDN fallback -->
    <script src="js/tesseract.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
