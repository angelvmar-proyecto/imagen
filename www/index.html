<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAR Caribe - Procesador Local</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --gold: #FFD700;
            --gold-dark: #C5A059;
            --text-main: #FFFFFF;
            --text-secondary: #AAAAAA;
            --accent-blue: #00bcd4;
            --danger: #ff4444;
            --success: #4caf50;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
        }
        h1, h2 {
            color: var(--gold);
            text-align: center;
            font-size: 1.2rem;
            margin: 10px 0;
        }
        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--gold-dark);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .btn-group {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        button {
            background-color: var(--gold);
            color: #000;
            border: none;
            padding: 8px 12px;
            font-weight: bold;
            border-radius: 4px;
            flex: 1;
            cursor: pointer;
            font-size: 0.85rem;
        }
        button.danger {
            background-color: var(--danger);
            color: #fff;
        }
        button.success {
            background-color: var(--success);
            color: #fff;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-blue);
        }
        .slider-container {
            margin: 8px 0;
            font-size: 0.9rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85rem;
        }
        th, td {
            border: 1px solid #444;
            padding: 6px;
            text-align: left;
            min-width: 90px;
        }
        th {
            background-color: #2c2c2c;
            color: var(--gold);
        }
        input[type="text"], select {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        .controls-row {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 280px;
            background: #000;
            overflow: hidden;
            border: 1px solid var(--gold-dark);
            border-radius: 4px;
            touch-action: none;
        }
        canvas {
            position: absolute;
            cursor: crosshair;
        }
        .log-box {
            background: #000;
            color: var(--accent-blue);
            font-family: monospace;
            font-size: 0.75rem;
            padding: 8px;
            border-radius: 4px;
            height: 50px;
            overflow-y: auto;
            border: 1px solid #333;
            margin-top: 5px;
        }
        .col-toggles {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            background: #151515;
            padding: 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Procesador Local - Tablas & Texto</h1>

    <div class="panel">
        <div class="btn-group">
            <button onclick="document.getElementById('fileInput').click()">Cargar Imagen</button>
            <button onclick="zoomIn()">Zoom +</button>
            <button onclick="zoomOut()">Zoom -</button>
            <button onclick="resetZoom()">Restaurar</button>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="loadImage(event)">
        
        <div class="canvas-container" id="canvasContainer">
            <canvas id="imageCanvas"></canvas>
        </div>
        
        <div class="btn-group" style="margin-top: 8px;">
            <button onclick="addLineH()">+ Línea H</button>
            <button onclick="addLineV()">+ Línea V</button>
            <button class="danger" onclick="clearLines()">Limpiar Líneas</button>
        </div>
        <div class="log-box" id="logBox">Sistema listo. Cargue una captura de WhatsApp y ajuste la cuadrícula.</div>
    </div>

    <div class="panel">
        <h2>Motores & Parámetros (YOLO / OCR)</h2>
        <button class="success" style="width:100%; margin-bottom:10px;" onclick="initMotors()">Inicializar & Procesar con Motores</button>
        
        <div class="slider-container">
            <label>YOLOv11 Confianza: <span id="yoloVal">0.95</span></label>
            <input type="range" min="0.1" max="1.0" step="0.05" value="0.95" oninput="document.getElementById('yoloVal').innerText=this.value">
        </div>
        
        <div class="slider-container">
            <label>PaddleOCR Umbral: <span id="ocrVal">0.9</span></label>
            <input type="range" min="0.1" max="1.0" step="0.05" value="0.9" oninput="document.getElementById('ocrVal').innerText=this.value">
        </div>
    </div>

    <div class="panel">
        <h2>Visor & Gestor de Tabla</h2>
        <div class="controls-row">
            <input type="text" id="searchInput" placeholder="Filtrar datos en tiempo real..." onkeyup="filterTable()">
            <button onclick="addRow()">+ Fila</button>
            <button onclick="promptAddColumn()">+ Columna</button>
            <button class="danger" onclick="clearTableData()">Vaciar</button>
        </div>
        
        <div class="col-toggles" id="colTogglesContainer">
            <span>Visibilidad:</span>
        </div>

        <div style="overflow-x: auto;">
            <table id="excelTable">
                <thead>
                    <tr id="tableHeaderRow">
                        <th>Promotor</th>
                        <th>Hotel</th>
                        <th>Horario</th>
                        <th>Status</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Inicia completamente en blanco -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let canvas = document.getElementById('imageCanvas');
        let ctx = canvas.getContext('2d');
        let img = new Image();
        let scale = 1;
        let panX = 0, panY = 0;
        let isDragging = false;
        let startX = 0, startY = 0;
        
        let linesH = [40, 100, 160];
        let linesV = [80, 180, 280];
        let activeLine = null;
        let lineType = null;

        // Estructura de columnas base (sin contar Acciones al final)
        let columnsList = ["Promotor", "Hotel", "Horario", "Status"];

        function log(msg) {
            const box = document.getElementById('logBox');
            box.innerText += "\n> " + msg;
            box.scrollTop = box.scrollHeight;
        }

        function loadImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                img.onload = function() {
                    scale = Math.min(canvas.parentElement.clientWidth / img.width, canvas.parentElement.clientHeight / img.height);
                    panX = (canvas.parentElement.clientWidth - img.width * scale) / 2;
                    panY = (canvas.parentElement.clientHeight - img.height * scale) / 2;
                    resizeCanvas();
                    redraw();
                    log("Imagen cargada correctamente.");
                }
                img.src = reader.result;
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            redraw();
        }

        window.addEventListener('resize', resizeCanvas);

        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(scale, scale);
            
            if (img.src) {
                ctx.drawImage(img, 0, 0);
            }

            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 2 / scale;
            linesH.forEach((y, index) => {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(img.width || 800, y);
                ctx.stroke();
                ctx.fillStyle = '#FFD700';
                ctx.font = `${12 / scale}px sans-serif`;
                ctx.fillText(`H${index+1}`, 10, y - 5);
            });

            ctx.strokeStyle = '#00bcd4';
            linesV.forEach((x, index) => {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, img.height || 600);
                ctx.stroke();
                ctx.fillStyle = '#00bcd4';
                ctx.fillText(`V${index+1}`, x + 5, 20);
            });

            ctx.restore();
        }

        const container = document.getElementById('canvasContainer');

        container.addEventListener('pointerdown', (e) => {
            const rect = container.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left - panX) / scale;
            const mouseY = (e.clientY - rect.top - panY) / scale;

            activeLine = null;
            for (let i = 0; i < linesH.length; i++) {
                if (Math.abs(mouseY - linesH[i]) < 15 / scale) {
                    activeLine = i;
                    lineType = 'H';
                    break;
                }
            }
            if (activeLine === null) {
                for (let i = 0; i < linesV.length; i++) {
                    if (Math.abs(mouseX - linesV[i]) < 15 / scale) {
                        activeLine = i;
                        lineType = 'V';
                        break;
                    }
                }
            }

            if (activeLine === null) {
                isDragging = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            }
        });

        container.addEventListener('pointermove', (e) => {
            if (activeLine !== null) {
                const rect = container.getBoundingClientRect();
                if (lineType === 'H') {
                    linesH[activeLine] = (e.clientY - rect.top - panY) / scale;
                } else {
                    linesV[activeLine] = (e.clientX - rect.left - panX) / scale;
                }
                redraw();
            } else if (isDragging) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                redraw();
            }
        });

        container.addEventListener('pointerup', () => {
            isDragging = false;
            activeLine = null;
        });

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.1;
            if (e.deltaY < 0) {
                scale *= zoomFactor;
            } else {
                scale /= zoomFactor;
            }
            redraw();
        });

        function zoomIn() { scale *= 1.2; redraw(); }
        function zoomOut() { scale /= 1.2; redraw(); }
        function resetZoom() {
            if(img.width) {
                scale = Math.min(canvas.parentElement.clientWidth / img.width, canvas.parentElement.clientHeight / img.height);
                panX = (canvas.parentElement.clientWidth - img.width * scale) / 2;
                panY = (canvas.parentElement.clientHeight - img.height * scale) / 2;
                redraw();
            }
        }

        function addLineH() {
            linesH.push((linesH[linesH.length-1] || 40) + 30);
            redraw();
        }

        function addLineV() {
            linesV.push((linesV[linesV.length-1] || 40) + 80);
            redraw();
        }

        function clearLines() {
            linesH = [];
            linesV = [];
            redraw();
            log("Líneas de cuadrícula eliminadas.");
        }

        function initMotors() {
            if (!img.src) {
                alert("Primero cargue una imagen para procesar.");
                return;
            }
            log("Inicializando YOLOv11 y PaddleOCR locales...");
            setTimeout(() => {
                log("Analizando recortes según la cuadrícula delimitada...");
                setTimeout(() => {
                    log("Extracción completada. Volcando datos reales en la tabla...");
                    // Simulando extracción limpia basada en la acción
                    addRowData("", "", "", "Pendiente");
                }, 800);
            }, 800);
        }

        function updateColumnToggles() {
            const togglesContainer = document.getElementById('colTogglesContainer');
            togglesContainer.innerHTML = '<span>Visibilidad:</span>';
            columnsList.forEach((colName, index) => {
                togglesContainer.innerHTML += `<label><input type="checkbox" checked onclick="toggleColumn(${index})"> ${colName}</label>`;
            });
        }

        function addRowData(val1="", val2="", val3="", statusVal="Pendiente", extraValues=[]) {
            const tbody = document.getElementById("tableBody");
            const newRow = tbody.insertRow();
            
            // Valores para columnas base
            let baseVals = [val1, val2, val3];
            for (let i = 0; i < columnsList.length - 1; i++) {
                const cell = newRow.insertCell(i);
                cell.contentEditable = "true";
                cell.innerText = baseVals[i] || "";
            }

            // Columna de Status (siempre la última de los datos)
            const statusCellIndex = columnsList.length - 1;
            const statusCell = newRow.insertCell(statusCellIndex);
            statusCell.innerHTML = `<select>
                <option value="Pendiente" ${statusVal==='Pendiente'?'selected':''}>Pendiente</option>
                <option value="Confirmado" ${statusVal==='Confirmado'?'selected':''}>Confirmado</option>
                <option value="Cancelado" ${statusVal==='Cancelado'?'selected':''}>Cancelado</option>
            </select>`;

            // Columna de Acciones
            const actionCell = newRow.insertCell(columnsList.length);
            actionCell.innerHTML = `<button class="danger" style="padding:2px 6px;" onclick="deleteRow(this)">X</button>`;
        }

        function addRow() {
            addRowData();
        }

        function promptAddColumn() {
            let colName = prompt("Nombre de la nueva columna:");
            if (colName && colName.trim() !== "") {
                columnsList.splice(columnsList.length - 1, 0, colName.trim()); // Insertar antes de Status
                rebuildTableStructure();
                log(`Columna '${colName}' agregada.`);
            }
        }

        function rebuildTableStructure() {
            const headerRow = document.getElementById("tableHeaderRow");
            headerRow.innerHTML = "";
            columnsList.forEach(col => {
                headerRow.innerHTML += `<th>${col}</th>`;
            });
            headerRow.innerHTML += `<th>Acciones</th>`;
            updateColumnToggles();
            
            // Limpiar datos al reestructurar columnas o mantener filas vacías
            document.getElementById("tableBody").innerHTML = "";
        }

        function deleteRow(btn) {
            const row = btn.parentNode.parentNode;
            row.parentNode.removeChild(row);
        }

        function clearTableData() {
            document.getElementById("tableBody").innerHTML = "";
            log("Tabla vaciada.");
        }

        function filterTable() {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const rows = document.getElementById("tableBody").getElementsByTagName("tr");
            for (let i = 0; i < rows.length; i++) {
                let text = rows[i].innerText.toLowerCase();
                rows[i].style.display = text.includes(input) ? "" : "none";
            }
        }

        function toggleColumn(colIndex) {
            const table = document.getElementById("excelTable");
            for (let row of table.rows) {
                if (row.cells[colIndex]) {
                    row.cells[colIndex].style.display = row.cells[colIndex].style.display === 'none' ? '' : 'none';
                }
            }
        }

        // Inicializar controles al cargar
        updateColumnToggles();
    </script>
</body>
</html>
