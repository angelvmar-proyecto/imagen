<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>MAR Caribe — Escáner de Tablas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { padding: 16px; background: #f5f5f5; color: #333; }
    h1 { text-align: center; color: #005b96; margin-bottom: 24px; font-size: 22px; }

    button {
      width: 100%; padding: 18px; margin: 8px 0; border: none; border-radius: 12px;
      font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-cargar { background: #0066cc; color: white; }
    .btn-procesar { background: #28a745; color: white; }
    .btn-copiar { background: #6c757d; color: white; padding: 10px; font-size: 14px; width: auto; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .progreso-container {
      width: 100%; height: 48px; background: #e9ecef; border-radius: 12px; margin: 16px 0;
      position: relative; overflow: hidden; border: 1px solid #ced4da;
    }
    .progreso-barra { height: 100%; width: 0%; background: #28a745; border-radius: 12px 0 0 12px; transition: width 0.3s ease; }
    .progreso-texto {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-weight: bold; font-size: 16px; color: #212529; white-space: nowrap;
    }
    .etapa-actual { text-align: center; font-size: 14px; color: #495057; margin-bottom: 8px; }
    .tiempo-info { text-align: center; font-size: 12px; color: #6c757d; margin-bottom: 12px; }

    .preview-container { width: 100%; max-height: 300px; overflow: auto; background: white; border-radius: 12px; padding: 8px; margin: 12px 0; border: 1px solid #ddd; }
    #previewImg { max-width: 100%; height: auto; display: block; }

    .log-container {
      width: 100%; background: #212529; color: #f8f9fa; border-radius: 12px; padding: 12px;
      margin: 16px 0; font-family: monospace; font-size: 12px; line-height: 1.5; max-height: 250px; overflow-y: auto;
    }
    .log-titulo { color: #ffc107; font-weight: bold; margin-bottom: 8px; }
    .ok { color: #28a745; }
    .info { color: #17a2b8; }
    .warn { color: #ffc107; }
    .error { color: #dc3545; }

    .resultado-container { width: 100%; overflow-x: auto; margin-top: 20px; }
    table { border-collapse: collapse; width: 100%; background: white; }
    th, td { border: 1px solid #dee2e6; padding: 8px 10px; text-align: left; font-size: 13px; }
    th { background: #005b96; color: white; position: sticky; top: 0; }
  </style>
</head>
<body>

  <h1>📋 MAR Caribe — Escáner de Tablas</h1>

  <button id="btnCargar" class="btn-cargar">📷 Cargar Imagen</button>
  <input type="file" id="inputImagen" accept="image/*" style="display:none">

  <div class="preview-container" id="previewContainer" style="display:none;">
    <img id="previewImg">
  </div>

  <button id="btnProcesar" class="btn-procesar" disabled>🔍 Procesar Tabla</button>

  <div class="etapa-actual" id="etapaActual">Listo para iniciar</div>
  <div class="progreso-container">
    <div class="progreso-barra" id="barraProgreso"></div>
    <div class="progreso-texto" id="textoProgreso">0%</div>
  </div>
  <div class="tiempo-info" id="tiempoInfo"></div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px;">
    <h3 style="color:#005b96; font-size:16px;">📝 Log de Depuración</h3>
    <button id="btnCopiarLog" class="btn-copiar">📋 Copiar Log</button>
  </div>
  <div class="log-container" id="logContainer">
    <div class="log-titulo">=== MAR Caribe — Log de Depuración ===</div>
    <div id="logContenido"></div>
  </div>

  <div class="resultado-container" id="resultadoContainer" style="display:none;">
    <h3 style="color:#005b96; margin:20px 0 10px;">📊 Tabla Extraída</h3>
    <table id="tablaResultado"></table>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
