<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAR Caribe — Escáner de Tablas</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- SheetJS para lectura local de Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>MAR Caribe - Autoajuste OCR</h1>
        
        <div class="card-upload">
            <label>1. Seleccionar Archivo Excel de Referencia:</label>
            <input type="file" id="excelFile" accept=".xlsx, .xls">
            
            <label>2. Seleccionar Imagen de WhatsApp:</label>
            <input type="file" id="imageFile" accept="image/*">
            
            <button onclick="ejecutarCalibracionDual()">Procesar y Autoajustar</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
