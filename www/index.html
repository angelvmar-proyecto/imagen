<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visor y Procesador OCR Edge</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: #1e1e1e;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid #333;
            z-index: 10;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 16px;
            color: #f39c12;
        }
        .toolbar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        button, label.btn-file {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        button:hover, label.btn-file:hover {
            background: #444;
        }
        input[type="file"] {
            display: none;
        }
        .engine-tabs {
            display: flex;
            gap: 5px;
        }
        .engine-tab {
            background: #222;
            border: 1px solid #444;
            color: #aaa;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .engine-tab.active {
            background: #f39c12;
            color: #000;
            border-color: #f39c12;
            font-weight: bold;
        }
        .engine-tab[data-engine="lfm"] {
            background: #8e44ad;
            color: #fff;
            border-color: #9b59b6;
        }
        .engine-tab[data-engine="lfm"].active {
            background: #9b59b6;
            color: #fff;
            font-weight: bold;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        #viewport {
            flex: 1;
            overflow: auto;
            position: relative;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #canvas-scaler {
            transform-origin: center center;
            transition: transform 0.1s ease-out;
        }
        canvas {
            display: block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .controls-overlay {
            position: absolute;
            bottom: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 5;
        }
        .controls-overlay button {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid #555;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .umbral-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e1e1e;
            padding: 6px 12px;
            border-top: 1px solid #333;
            font-size: 13px;
        }
        .umbral-container input[type="range"] {
            flex: 1;
            accent-color: #f39c12;
        }
        .excel-panel {
            height: 180px;
            background: #181818;
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        .excel-toolbar {
            background: #222;
            padding: 5px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            font-size: 12px;
        }
        .excel-container {
            flex: 1;
            overflow: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: monospace;
            font-size: 12px;
        }
        th, td {
            border: 1px solid #333;
            padding: 6px 8px;
            text-align: left;
            color: #ccc;
            white-space: nowrap;
        }
        th {
            background: #222;
            position: sticky;
            top: 0;
            z-index: 2;
            color: #f39c12;
        }
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-size: 14px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #f39c12;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <!-- Tesseract.js para OCR clásico de respaldo -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5.0.5/dist/tesseract.min.js"></script>
</head>
<body>

    <header>
        <div class="top-bar">
            <h1>Visor y Procesador Edge OCR</h1>
            <div class="toolbar">
                <label for="file-input" class="btn-file">📂 Cargar</label>
                <input type="file" id="file-input" accept="image/*">
                
                <button id="btn-h">L.H.</button>
                <button id="btn-v">L.V.</button>
                <button id="btn-bloquear">🔒 Bloquear</button>
                <button id="reset-l">Reset L.</button>
                <button id="btn-vaciar">Vaciar</button>
                <button id="btn-search">📋 Log</button>
                <button id="btn-exportar">📥 CSV</button>
            </div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
            <div class="engine-tabs">
                <button class="engine-tab active" data-engine="tesseract">Tesseract</button>
                <button class="engine-tab" data-engine="paddle">PaddleOCR</button>
                <button class="engine-tab" data-engine="mlkit">ML Kit</button>
                <button class="engine-tab" data-engine="lfm">LFM 2.5-VL</button>
            </div>
        </div>
    </header>

    <div class="main-content">
        <div id="viewport">
            <div id="canvas-scaler">
                <canvas id="processing-canvas"></canvas>
            </div>
        </div>

        <div class="controls-overlay">
            <button id="zoom-in">+</button>
            <button id="zoom-reset">⊙</button>
            <button id="zoom-out">-</button>
        </div>

        <div id="loading-overlay">
            <div class="spinner"></div>
            <div id="loading-status-title" style="font-weight: bold;">Procesando imagen...</div>
            <div id="progress-text">0%</div>
        </div>
    </div>

    <div class="umbral-container">
        <label for="umbral-slider">Umbral:</label>
        <input type="range" id="umbral-slider" min="0" max="100" value="50">
        <span id="umbral-val" style="min-width: 30px; text-align: right;">50</span>
    </div>

    <div class="excel-panel">
        <div class="excel-toolbar">
            <span id="excel-status" style="color: #f39c12; font-weight: bold;">Estado: Esperando imagen...</span>
            <div style="display: flex; gap: 5px; align-items: center;">
                <span id="active-cell-label" style="background:#333; padding:2px 6px; border-radius:3px; font-weight:bold;">A1</span>
                <input type="text" id="cell-value-input" style="background:#111; color:#fff; border:1px solid #444; padding:3px 6px; border-radius:3px; font-size:12px;" placeholder="Valor de celda">
            </div>
        </div>
        <div class="excel-container">
            <table>
                <tbody id="excel-tbody">
                    <!-- Filas generadas dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
