<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAR Caribe — Leer Tablas de Imagen</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header>
  <h1>🏝️ MAR Caribe</h1>
  <p>Leer imagen con tabla → convertir a tabla de datos</p>
</header>

<main>
  <!-- PASO 1: SELECCIONAR IMAGEN -->
  <div id="paso1">
    <h2>1. Selecciona la imagen</h2>
    <p>Elige la imagen que recibiste por WhatsApp</p>
    
    <input type="file" id="selectorImagen" accept="image/*">
    <button id="btnSeleccionar">📁 Elegir Imagen</button>
    
    <div id="vistaImagen" style="display:none; margin:15px 0;">
      <img id="imgPreview" style="max-width:100%; border-radius:8px;">
      <button id="btnLeer" style="margin-top:10px;">🔍 Leer y Convertir a Tabla</button>
    </div>
  </div>

  <!-- PASO 2: TEXTO EXTRAÍDO -->
  <div id="paso2" style="display:none;">
    <h2>2. Texto extraído</h2>
    <textarea id="textoExtraido" rows="10" placeholder="El texto aparecerá aquí..."></textarea>
    <button id="btnCrearTabla">📊 Crear Tabla</button>
    <button id="btnVolver1">⬅️ Cambiar imagen</button>
  </div>

  <!-- PASO 3: TABLA GENERADA -->
  <div id="paso3" style="display:none;">
    <h2>3. Tabla generada</h2>
    <div id="contenedorTabla"></div>
    <button id="btnCopiar">📋 Copiar tabla</button>
    <button id="btnEnviarWA">💬 Enviar por WhatsApp</button>
    <button id="btnNueva">🔄 Nueva imagen</button>
  </div>

  <div id="mensaje"></div>
</main>

<script src="js/app.js"></script>
</body>
</html>
