<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
  <title>MAR Caribe — Escáner de Tablas + Aprendizaje</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #f1f5f9; padding: 12px; max-width: 100vw; }
    h1 { font-size: 1.4rem; margin-bottom: 16px; color: #38bdf8; text-align: center; }
    .zona-botones { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    button { padding: 12px 16px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primario { background: #2563eb; color: white; }
    .btn-exito { background: #16a34a; color: white; }
    .btn-aviso { background: #f59e0b; color: #1e293b; }
    .btn-peligro { background: #dc2626; color: white; }
    button:active { transform: scale(0.97); }
    #inputImagen { display: none; }
    .preview-wrapper { position: relative; margin: 16px 0; border: 2px solid #334155; border-radius: 12px; overflow: auto; max-width: 100%; }
    #previewImg { display: block; max-width: 100%; height: auto; }
    #canvasLineas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .progreso { margin: 16px 0; background: #1e293b; border-radius: 8px; height: 24px; overflow: hidden; }
    #barraProgreso { height: 100%; background: linear-gradient(90deg, #22c55e, #3b82f6); width: 0%; transition: width 0.3s; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; }
    .etapa { display: flex; justify-content: space-between; margin: 8px 0; font-size: 0.9rem; color: #94a3b8; }
    #logContainer { background: #1e293b; border-radius: 8px; padding: 12px; margin: 16px 0; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; line-height: 1.6; }
    #tablaResultado { width: 100%; border-collapse: collapse; margin-top: 16px; background: #1e293b; border-radius: 8px; overflow: hidden; }
    #tablaResultado th, #tablaResultado td { border: 1px solid #334155; padding: 8px; text-align: center; font-size: 0.85rem; }
    #tablaResultado th { background: #1e40af; color: white; }
    .zona-aprendizaje { background: #1e293b; border-radius: 8px; padding: 12px; margin: 16px 0; border-left: 3px solid #22c55e; }
    .zona-aprendizaje h3 { font-size: 0.9rem; color: #22c55e; margin-bottom: 8px; }
    .tiempo { text-align: right; font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }
  </style>
</head>
<body>

<h1>📊 MAR Caribe — Escáner de Tablas + 🧠 Aprendizaje</h1>

<div class="zona-botones">
  <button id="btnCargar" class="btn-primario">📁 Elegir Imagen</button>
  <input type="file" id="inputImagen" accept="image/*">
  <button id="btnProcesar" class="btn-exito" disabled>▶️ Procesar Tabla</button>
  <button id="btnCopiarLog" class="btn-aviso">📋 Copiar Log</button>
</div>

<div class="zona-aprendizaje">
  <h3>🧠 Control de Aprendizaje Automático</h3>
  <div class="zona-botones">
    <button id="btnEditarLineas" class="btn-primario" onclick="activarEdicionLineas()">✏️ Editar Líneas</button>
    <button id="btnGuardarAjustes" class="btn-exito">💾 Guardar y Aprender</button>
    <button id="btnReiniciarAprendizaje" class="btn-peligro">🗑️ Reiniciar</button>
  </div>
  <p style="font-size:0.8rem; color:#94a3b8; margin-top:8px;">Arrastra las líneas a su posición correcta → Guardar → El sistema aprende para la siguiente imagen</p>
</div>

<div class="tiempo" id="tiempoInfo">Transcurrido: 0.0s</div>
<div class="etapa">
  <span id="etapaActual">Esperando imagen...</span>
</div>
<div class="progreso">
  <div id="barraProgreso"><span id="textoProgreso">0%</span></div>
</div>

<div class="preview-wrapper" id="previewContainer" style="display:none;">
  <img id="previewImg" alt="Vista previa">
  <canvas id="canvasLineas"></canvas>
</div>

<div id="logContainer">
  <div id="logContenido"></div>
</div>

<h2>📋 Tabla Extraída</h2>
<table id="tablaResultado"></table>

<script src="js/app.js"></script>
</body>
</html>
