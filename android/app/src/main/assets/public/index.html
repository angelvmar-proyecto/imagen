<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR Timeshare</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; padding: 12px; background: #fafafa; margin: 0; color: #1a1a1a; }
    h1 { font-size: 20px; margin: 8px 0 12px 0; }
    button { padding: 14px 20px; font-size: 16px; margin: 5px 0; width: 100%; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
    #btnCamara { background: #3b82f6; color: white; }
    #btnGaleria { background: #8b5cf6; color: white; }
    #estado { color: #444; margin-top: 10px; font-size: 14px; }
    #barraContenedor { width: 100%; height: 24px; background: #e0e0e0; border-radius: 12px; overflow: hidden; margin-top: 15px; display: none; }
    #barraProgreso { height: 100%; width: 0%; background: linear-gradient(90deg, #4CAF50, #8BC34A); border-radius: 12px; transition: width 0.3s ease; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: bold; }
    #barraTexto { text-align: center; font-size: 12px; color: #666; margin-top: 5px; min-height: 16px; }

    #tablaContenedor {
      margin-top: 20px; overflow: auto; border: 2px solid #333; border-radius: 6px;
      max-height: 65vh; display: none; background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #tablaResultado {
      border-collapse: collapse; font-size: 11px;
      font-family: 'Roboto Mono', 'Courier New', monospace;
      color: #000; table-layout: auto;
    }
    #tablaResultado th,
    #tablaResultado td {
      border: 1px solid #666; padding: 3px 5px; vertical-align: top;
      white-space: nowrap; text-overflow: ellipsis; overflow: hidden;
      color: #000; background: #fff; font-weight: 500; line-height: 1.3;
      max-width: 180px;
    }
    #tablaResultado td.col-num {
      background: #e8e8e8; color: #333; text-align: center;
      width: 28px; min-width: 28px; font-weight: 700;
      position: sticky; left: 0; z-index: 2; border-right: 2px solid #333;
    }
    #tablaResultado tr:nth-child(even) td { background: #f5f5f5; }
    #tablaResultado tr:nth-child(even) td.col-num { background: #ddd; }
    #tablaResultado td:focus { outline: 2px solid #3b82f6; background: #e3f2fd !important; }

    #botonesExportar { display: none; }
    #debug { white-space: pre-wrap; background: #ffe0e0; padding: 10px; margin-top: 10px; font-size: 10px; color: #a00; max-height: 30vh; overflow: auto; display: none; border-radius: 6px; font-family: monospace; }
    #resultado { white-space: pre-wrap; background: #f0f0f0; padding: 10px; margin-top: 10px; font-size: 11px; max-height: 40vh; overflow: auto; display: none; border-radius: 6px; font-family: monospace; color: #222; }
  </style>
  <script type="module" crossorigin src="/assets/index-MfOCjVHc.js"></script>
</head>
<body>
  <h1>OCR Timeshare</h1>
  <button id="btnCamara">📷 Tomar Foto</button>
  <button id="btnGaleria">🖼️ Elegir de Galería</button>
  <div id="estado">Cargando...</div>

  <div id="barraContenedor">
    <div id="barraProgreso">0%</div>
  </div>
  <div id="barraTexto"></div>

  <div id="tablaContenedor">
    <table id="tablaResultado"><tbody></tbody></table>
  </div>

  <div id="resultado"></div>
  <div id="debug"></div>

  <script>
    window.addEventListener('error', (e) => {
      const dbg = document.getElementById('debug');
      if (dbg) { dbg.style.display = 'block'; dbg.textContent += `[ERROR] ${e.message} en ${e.filename}:${e.lineno}\n`; }
    });
    window.addEventListener('unhandledrejection', (e) => {
      const dbg = document.getElementById('debug');
      if (dbg) { dbg.style.display = 'block'; dbg.textContent += `[PROMESA] ${e.reason}\n`; }
    });
  </script>

  <script src="js/config-deteccion.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/preprocesamiento.js"></script>
  <script src="js/deteccion.js"></script>
  <script src="js/lidar.js"></script>
  <script src="js/retina.js"></script>
</body>
</html>
