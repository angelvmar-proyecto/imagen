<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imagen OCR</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #fafafa; }
    h1 { font-size: 20px; }
    button { padding: 15px 30px; font-size: 16px; margin: 5px 0; width: 100%; }
    #estado { color: #666; margin-top: 10px; font-size: 14px; }
    #resultado { margin-top: 20px; font-size: 12px; }
    #resultado img { max-width: 100%; border: 1px solid #ccc; }
    #debug { white-space: pre-wrap; background: #ffe0e0; padding: 10px; margin-top: 10px; font-size: 11px; color: #a00; max-height: 30vh; overflow: auto; display: none; }
  </style>
  <script type="module" crossorigin src="/assets/index-Cg4Mo89E.js"></script>
</head>
<body>
  <h1>OCR Timeshare</h1>
  <button id="btnCamara">📷 Tomar Foto</button>
  <button id="btnGaleria">🖼️ Elegir de Galería</button>
  <div id="estado">Cargando...</div>
  <div id="resultado"></div>
  <div id="debug"></div>

  <script>
    window.addEventListener('error', (e) => {
      const dbg = document.getElementById('debug');
      if (dbg) {
        dbg.style.display = 'block';
        dbg.textContent += `[ERROR GLOBAL] ${e.message}\n  en ${e.filename}:${e.lineno}\n\n`;
      }
    });
    window.addEventListener('unhandledrejection', (e) => {
      const dbg = document.getElementById('debug');
      if (dbg) {
        dbg.style.display = 'block';
        dbg.textContent += `[PROMESA] ${e.reason}\n\n`;
      }
    });
  </script>
</body>
</html>
